<!DOCTYPE html>
<html>
<head>
    <title>Cleanup Empty Records</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        button { background: #dc3545; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; margin: 8px; }
        button:hover { background: #c82333; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .warning { background: #fff3cd; border: 1px solid #ffeaa7; color: #856404; }
    </style>
</head>
<body>
    <h1>Cleanup Empty Records</h1>
    <p><strong>Warning:</strong> This will permanently delete all Xano records that have empty media_url or attachment fields.</p>
    <p>This cleanup is needed before running the Cloudinary sync to avoid conflicts with legacy data.</p>
    
    <button id="cleanupBtn" onclick="runCleanup()">Delete Empty Records</button>
    <a href="/sync-assets.html" style="text-decoration: none;">
        <button style="background: #007cba;">Go to Sync Page</button>
    </a>
    
    <div id="result"></div>

    <script>
        async function runCleanup() {
            const btn = document.getElementById('cleanupBtn');
            const result = document.getElementById('result');
            
            btn.disabled = true;
            btn.textContent = 'Deleting...';
            result.innerHTML = '';
            
            try {
                const response = await fetch('/.netlify/functions/cleanup-empty-records', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    result.className = 'result success';
                    result.innerHTML = `
                        <h3>Cleanup Complete!</h3>
                        <p>Total records found: ${data.total_records}</p>
                        <p>Records with empty URLs: ${data.records_with_empty_urls}</p>
                        <p>Successfully deleted: ${data.deleted}</p>
                        ${data.errors.length > 0 ? `<p>Errors: ${data.errors.length}</p>` : ''}
                        <p><strong>Next step:</strong> <a href="/sync-assets.html">Run the Cloudinary sync</a> to import fresh assets.</p>
                    `;
                } else {
                    throw new Error(data.error || 'Cleanup failed');
                }
            } catch (error) {
                result.className = 'result error';
                result.innerHTML = `<h3>Cleanup Failed</h3><p>${error.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Delete Empty Records';
            }
        }
    </script>
</body>
</html>

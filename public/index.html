<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Primary redirect (instant) -->
  <meta http-equiv="refresh" content="0; url=https://streamofdan.com/">
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#0b1020;color:#e7eaf3}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{max-width:720px;width:100%;background:#141b34;border:1px solid #222b52;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    h1{margin:0 0 8px;font-size:20px}
    p{margin:6px 0;color:#b8c0de}
    a{color:#86b7ff;text-decoration:none}
    a:hover{text-decoration:underline}
    .note{margin-top:14px;font-size:13px;color:#92a1cf}
  </style>
  <script>
    // JS redirect as a fallback if meta refresh is blocked
    (function(){
      var target = "https://streamofdan.com/";
      try { window.location.replace(target); } catch(_) { window.location.href = target; }
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Redirecting…</h1>
      <p>If you’re not redirected automatically, <a href="https://streamofdan.com/">click here to continue</a>.</p>
      <p class="note">
        Need the Blog Admin? It’s still available at
        <a href="/blog-admin">/blog-admin</a>.
      </p>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Professional Blog Manager</title>
  <link rel="stylesheet" href="css/blog-manager-professional.css" />
  <link rel="stylesheet" href="css/quill.snow.css" />
</head>
<body>
  <div class="header">
    <h1>📝 Blog Manager</h1>
    <div><button class="theme-toggle" onclick="toggleTheme()">🌙 Toggle Theme</button></div>
  </div>

  <div class="container">
    <div class="main-content">
      <div class="form-section">
        <h2 class="section-title">Post Details</h2>

        <div class="form-group">
          <label class="form-label" for="title">Title *</label>
          <input type="text" id="title" class="form-input" placeholder="Enter post title..." required />
        </div>

        <div class="form-group">
          <label class="form-label" for="slug">Slug (URL)</label>
          <input type="text" id="slug" class="form-input" placeholder="auto-generated-from-title" />
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div class="form-group">
            <label class="form-label" for="author">Author</label>
            <input type="text" id="author" class="form-input" placeholder="Author name" />
          </div>
          <div class="form-group">
            <label class="form-label" for="status">Status</label>
            <select id="status" class="form-select">
              <option value="draft">📝 Draft</option>
              <option value="published">✅ Published</option>
              <option value="scheduled">⏰ Scheduled</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="scheduleAt">Publish Date/Time (for scheduled posts)</label>
          <input type="datetime-local" id="scheduleAt" class="form-input" />
        </div>

        <div class="form-group">
          <label class="form-label" for="tags">Tags</label>
          <input type="text" id="tags" class="form-input" placeholder="tag1, tag2, tag3" />
        </div>

        <div class="form-group">
          <label class="form-label" for="summary">Summary</label>
          <textarea id="summary" class="form-textarea" rows="3" placeholder="Brief description of the post..."></textarea>
        </div>

        <!-- REQUIRED by your Webflow schema -->
        <div class="form-group">
          <label class="form-label" for="mediaUrl">Media URL *</label>
          <input type="url" id="mediaUrl" class="form-input" placeholder="https://example.com/media.mp3" required />
        </div>
      </div>

      <div class="form-section">
        <h2 class="section-title">Hero Image</h2>

        <div class="form-group">
          <label class="form-label" for="heroUrl">Image URL</label>
          <input type="url" id="heroUrl" class="form-input" placeholder="https://example.com/image.jpg" />
        </div>

        <div class="form-group">
          <label class="form-label" for="heroAlt">Alt Text</label>
          <input type="text" id="heroAlt" class="form-input" placeholder="Describe the image..." />
        </div>

        <div class="form-group">
          <label class="form-label">Upload Image</label>
          <div class="upload-zone" id="heroDropZone">
            <div>📁 Click to upload or drag & drop</div>
            <div style="font-size:.875rem;color:var(--text-secondary);margin-top:.5rem;">Supports: JPG, PNG, WebP (Max: 50MB)</div>
            <input type="file" id="heroInput" accept="image/*" style="display:none;" />
          </div>
          <div id="heroPreview"></div>
        </div>
      </div>

      <div class="form-section">
        <h2 class="section-title">Content</h2>
        <div class="editor-container"><div id="editor"></div></div>
      </div>

      <div class="btn-group">
        <button id="saveDraftBtn" class="btn btn-secondary">💾 Save Draft</button>
        <button id="previewBtn" class="btn btn-warning">👁️ Preview</button>
        <button id="publishBtn" class="btn btn-success">🚀 Publish Now</button>
        <button id="scheduleBtn" class="btn btn-primary" style="display:none;">⏰ Schedule Post</button>
      </div>

      <div id="messages"></div>
    </div>

    <div class="sidebar">
      <div class="preview-panel">
        <h3 class="section-title">Live Preview</h3>
        <div id="previewContent">
          <p style="color:var(--text-secondary);text-align:center;padding:2rem;">Start writing to see a preview...</p>
        </div>
      </div>

      <div class="comments-section">
        <h3 class="section-title">Comments</h3>
        <div class="form-group">
          <label class="form-label"><input type="checkbox" id="requireApproval" style="margin-right:.5rem;">Require approval for new comments</label>
        </div>
        <div class="form-group">
          <label class="form-label" for="filterState">Filter by state:</label>
          <select id="filterState" class="form-select">
            <option value="">All Comments</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="filterPostId">Post ID:</label>
          <input type="text" id="filterPostId" class="form-input" placeholder="Optional" />
        </div>
        <div class="form-group">
          <input type="text" id="commentSearch" class="form-input" placeholder="Search comments..." />
        </div>
        <button id="refreshComments" class="btn btn-secondary" style="width:100%;">🔄 Refresh Comments</button>
        <div id="commentsList" style="margin-top:1rem;">
          <p style="color:var(--text-secondary);text-align:center;padding:1rem;">No comments to display</p>
        </div>
      </div>
    </div>
  </div>

  <input type="hidden" id="postId" value="" />

  <script src="js/quill.min.js"></script>
  <script src="js/marked.min.js"></script>
  <script>
    const CFG = {
      fns: {
        create: '/.netlify/functions/posts-create',
        update: '/.netlify/functions/posts-create',
        schedule: '/.netlify/functions/posts-create',
        listComments: '/.netlify/functions/comments-list',
        moderateComment: '/.netlify/functions/comments-moderate',
        getSettings: '/.netlify/functions/comments-settings-get',
        setSettings: '/.netlify/functions/comments-settings-set',
        upload: '/.netlify/functions/file-manager-upload'
      },
      cloudinary: {
        uploadUrl: 'https://api.cloudinary.com/v1_1/dzrw8nopf/auto/upload',
        uploadPreset: 'blogHeroUnsigned'
      }
    };

    let quill, commentsData = [];

    document.addEventListener('DOMContentLoaded', () => {
      initQuill();
      setupEventListeners();
      loadComments();
      restoreTheme();
    });

    function initQuill() {
      const el = document.getElementById('editor');
      if (!el) return;
      quill = new Quill(el, {
        theme: 'snow',
        modules: {
          toolbar: [
            ['bold','italic','underline','strike'],
            [{ 'header': [1,2,3,false] }],
            ['blockquote','code-block'],
            [{ 'list':'ordered' },{ 'list':'bullet' }],
            ['link','image'],
            ['clean']
          ]
        }
      });
      quill.on('text-change', updatePreview);
    }

    function setupEventListeners() {
      document.getElementById('title').addEventListener('input', () => { updateSlug(); updatePreview(); });
      document.getElementById('status').addEventListener('change', function() {
        const scheduleBtn = document.getElementById('scheduleBtn');
        const publishBtn = document.getElementById('publishBtn');
        if (this.value === 'scheduled') { scheduleBtn.style.display='inline-flex'; publishBtn.style.display='none'; }
        else { scheduleBtn.style.display='none'; publishBtn.style.display='inline-flex'; }
        updatePreview();
      });
      ['author','tags','summary','heroUrl','heroAlt','scheduleAt','mediaUrl'].forEach(id => {
        document.getElementById(id).addEventListener('input', updatePreview);
      });
      document.getElementById('saveDraftBtn').addEventListener('click', (e)=>{ e.preventDefault(); savePost('draft'); });
      document.getElementById('publishBtn').addEventListener('click', (e)=>{ e.preventDefault(); savePost('published'); });
      document.getElementById('scheduleBtn').addEventListener('click', (e)=>{ e.preventDefault(); savePost('scheduled'); });
      document.getElementById('previewBtn').addEventListener('click', openPreview);
      setupHeroUpload();
      document.getElementById('refreshComments').addEventListener('click', loadComments);
      document.getElementById('commentSearch').addEventListener('input', filterComments);
      document.getElementById('filterState').addEventListener('change', filterComments);
    }

    function updateSlug() {
      const title = document.getElementById('title').value;
      const slug = title.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
      document.getElementById('slug').value = slug;
    }

    function updatePreview() {
      const title = document.getElementById('title').value || 'Untitled Post';
      const author = document.getElementById('author').value || 'Anonymous';
      const status = document.getElementById('status').value;
      const heroUrl = document.getElementById('heroUrl').value;
      const summary = document.getElementById('summary').value;
      const content = quill ? quill.root.innerHTML : '';
      const statusBadge = `<span class="status-${status}">${getStatusLabel(status)}</span>`;
      let html = `
        <div style="margin-bottom:1rem;">
          <h1 style="margin-bottom:.5rem;">${title}</h1>
          <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;font-size:.875rem;color:var(--text-secondary);">
            <span>By ${author}</span>${statusBadge}
          </div>
        </div>`;
      if (heroUrl) html += `<img src="${heroUrl}" alt="${document.getElementById('heroAlt').value}" style="width:100%;height:200px;object-fit:cover;border-radius:6px;margin-bottom:1rem;">`;
      if (summary) html += `<div style="font-style:italic;margin-bottom:1rem;padding:1rem;background:rgba(59,130,246,.1);border-left:3px solid var(--accent);border-radius:4px;">${summary}</div>`;
      html += `<div>${content}</div>`;
      document.getElementById('previewContent').innerHTML = html;
    }

    function getStatusLabel(status) {
      return ({ draft:'📝 Draft', published:'✅ Published', scheduled:'⏰ Scheduled' })[status] || status;
    }

    function toIsoOrEmpty(localValue) {
      if (!localValue) return '';
      const dt = new Date(localValue);
      return isNaN(dt.getTime()) ? '' : dt.toISOString();
    }

    function buildPayload(forceStatus) {
      const title = document.getElementById('title').value.trim();
      const slug = document.getElementById('slug').value.trim() || generateSlug(title);
      const status = forceStatus || document.getElementById('status').value;

      const payload = {
        title,
        slug,
        status,
        summary: document.getElementById('summary').value,
        bodyHtml: quill ? quill.root.innerHTML : '',
        featureImageUrl: document.getElementById('heroUrl').value,
        mediaUrl: document.getElementById('mediaUrl').value // REQUIRED
      };

      if (status === 'scheduled') {
        const when = toIsoOrEmpty(document.getElementById('scheduleAt').value);
        if (when) payload.publishDate = when;
      } else if (status === 'published') {
        const chosen = toIsoOrEmpty(document.getElementById('scheduleAt').value);
        payload.publishDate = chosen || new Date().toISOString();
      }

      return payload;
    }

    async function savePost(forceStatus = null) {
      const title = document.getElementById('title').value.trim();
      const mediaUrl = document.getElementById('mediaUrl').value.trim();
      if (!title) return showMessage('Please enter a title','error');
      if (!mediaUrl) return showMessage('Please enter a Media URL','error');

      const status = forceStatus || document.getElementById('status').value;
      const postId = document.getElementById('postId').value;

      try {
        showMessage('Saving...','info');
        const endpoint = postId ? CFG.fns.update : CFG.fns.create;
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type':'application/json','Accept':'application/json' },
          body: JSON.stringify(buildPayload(status))
        });
        const text = await res.text();
        let result; try { result = JSON.parse(text); } catch { throw new Error('Invalid JSON: '+text.slice(0,200)); }
        if (!res.ok) throw new Error(result?.error || result?.message || 'Save failed');

        if (!postId && result.id) document.getElementById('postId').value = result.id;
        document.getElementById('status').value = status;
        updatePreview();
        showMessage(`Post ${status==='published'?'published':status==='scheduled'?'scheduled':'saved as draft'} successfully!`,'success');
      } catch (err) {
        console.error('Save error:', err);
        showMessage('Error: '+err.message,'error');
      }
    }

    function openPreview() {
      const previewContent = document.getElementById('previewContent').innerHTML;
      const w = window.open('', '_blank');
      w.document.write(`<!DOCTYPE html><html><head><title>Preview</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:800px;margin:0 auto;padding:2rem}img{max-width:100%;height:auto}</style></head><body>${previewContent}</body></html>`);
      w.document.close();
    }

    function setupHeroUpload() {
      const dz = document.getElementById('heroDropZone');
      const input = document.getElementById('heroInput');
      dz.addEventListener('click', ()=>input.click());
      dz.addEventListener('dragover', (e)=>{e.preventDefault();dz.style.borderColor='var(--accent)';});
      dz.addEventListener('dragleave', (e)=>{e.preventDefault();dz.style.borderColor='';});
      dz.addEventListener('drop', (e)=>{e.preventDefault();dz.style.borderColor='';handleHeroFiles(e.dataTransfer.files);});
      input.addEventListener('change', ()=>handleHeroFiles(input.files));
    }

    async function handleHeroFiles(files) {
      const file = files?.[0]; if (!file) return;
      if (file.size > 50*1024*1024) return showMessage('File too large. Max 50MB.','error');
      try {
        showMessage('Uploading image...','info');
        if (CFG.cloudinary.uploadUrl && CFG.cloudinary.uploadPreset) {
          const form = new FormData();
          form.append('file', file);
          form.append('upload_preset', CFG.cloudinary.uploadPreset);
          const r = await fetch(CFG.cloudinary.uploadUrl, { method:'POST', body: form });
          const j = await r.json();
          if (r.ok && j.secure_url) {
            document.getElementById('heroUrl').value = j.secure_url;
            updateHeroPreview(j.secure_url, file.name); updatePreview();
            showMessage('Image uploaded successfully!','success');
            return;
          }
        }
        const form2 = new FormData(); form2.append('attachment', file);
        const r2 = await fetch(CFG.fns.upload, { method:'POST', body: form2 });
        const t2 = await r2.text(); const j2 = JSON.parse(t2);
        if (r2.ok && j2.url) {
          document.getElementById('heroUrl').value = j2.url;
          updateHeroPreview(j2.url, file.name); updatePreview();
          showMessage('Image uploaded successfully!','success');
        } else { throw new Error(j2.error || 'Upload failed'); }
      } catch (e) {
        console.error('Upload error:', e);
        showMessage('Upload failed: '+e.message,'error');
      }
    }

    function updateHeroPreview(url, name) {
      document.getElementById('heroPreview').innerHTML =
        `<div style="margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:6px;background:var(--bg-tertiary);">
           <img src="${url}" alt="${name}" style="width:100%;max-height:200px;object-fit:cover;border-radius:4px;">
           <div style="margin-top:.5rem;font-size:.875rem;color:var(--text-secondary);">${name}</div>
           <button onclick="clearHeroImage()" style="margin-top:.5rem;padding:.25rem .5rem;background:var(--error);color:#fff;border:none;border-radius:4px;font-size:.75rem;cursor:pointer;">Remove</button>
         </div>`;
    }

    function clearHeroImage() {
      document.getElementById('heroUrl').value = '';
      document.getElementById('heroAlt').value = '';
      document.getElementById('heroPreview').innerHTML = '';
      updatePreview();
    }

    async function loadComments() {
      try {
        const state = document.getElementById('filterState').value;
        const postId = document.getElementById('filterPostId').value.trim();
        if (!postId) {
          commentsData = [];
          document.getElementById('commentsList').innerHTML =
            `<p style="color:var(--text-secondary);text-align:center;padding:1rem;">Enter a Post ID to load comments</p>`;
          return;
        }
        const params = new URLSearchParams(); if (state) params.set('state', state); params.set('postId', postId);
        const r = await fetch(CFG.fns.listComments + '?' + params.toString());
        const t = await r.text();
        let list; try { list = JSON.parse(t); } catch {
          if (t.includes('Missing postId')) {
            document.getElementById('commentsList').innerHTML =
              `<p style="color:var(--text-secondary);text-align:center;padding:1rem;">Enter a valid Post ID to load comments</p>`;
            return;
          }
          throw new Error('Server returned invalid response: ' + t.slice(0,100));
        }
        if (!r.ok) throw new Error(list.error || 'Failed to load comments');
        commentsData = Array.isArray(list) ? list : [];
        filterComments();
      } catch (e) {
        console.error('Load comments error:', e);
        document.getElementById('commentsList').innerHTML =
          `<p style="color:var(--error);text-align:center;padding:1rem;">Error loading comments: ${e.message}</p>`;
      }
    }

    function filterComments() {
      const q = document.getElementById('commentSearch').value.toLowerCase();
      const filtered = (commentsData||[]).filter(c => (c.content||'').toLowerCase().includes(q) || (c.author||'').toLowerCase().includes(q));
      const el = document.getElementById('commentsList');
      if (!filtered.length) { el.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:1rem;">No comments found</p>'; return; }
      el.innerHTML = filtered.map(c => `
        <div style="border:1px solid var(--border);border-radius:6px;padding:1rem;margin-bottom:1rem;background:var(--bg-tertiary);">
          <div style="font-weight:500;margin-bottom:.5rem;">${c.author||'Anonymous'}</div>
          <div style="margin-bottom:.5rem;font-size:.875rem;">${c.content||''}</div>
          <div style="display:flex;gap:.5rem;">
            <button onclick="moderateComment('${c.id}','approve')" class="btn btn-success" style="padding:.25rem .5rem;font-size:.75rem;">Approve</button>
            <button onclick="moderateComment('${c.id}','reject')" class="btn btn-secondary" style="padding:.25rem .5rem;font-size:.75rem;">Reject</button>
          </div>
        </div>`).join('');
    }

    async function moderateComment(id, action) {
      try {
        const r = await fetch(CFG.fns.moderateComment, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ id, action })
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Moderation failed');
        showMessage(`Comment ${action}d successfully!`,'success'); loadComments();
      } catch (e) { console.error('Moderation error:', e); showMessage('Error: '+e.message,'error'); }
    }

    function showMessage(text, type='info') {
      const wrap = document.getElementById('messages');
      const el = document.createElement('div');
      el.className = `message message-${type}`;
      el.textContent = text;
      wrap.appendChild(el);
      setTimeout(()=>el.remove(), 5000);
    }

    function generateSlug(title) {
      return title.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      if (isDark) { html.classList.remove('dark'); localStorage.setItem('theme','light'); }
      else { html.classList.add('dark'); localStorage.setItem('theme','dark'); }
    }

    function restoreTheme() {
      if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    }
  </script>
</body>
</html>

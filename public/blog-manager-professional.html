<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Professional Blog Manager</title>

  <!-- TinyMCE (your working key) -->
  <script src="https://cdn.tiny.cloud/1/siwxtemdwh0tqidlreq3djqjv6pvqjcgl4v43rzu19yuqgs2/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>

  <!-- Basic styling so it’s readable -->
  <style>
    :root{--bg:#111315;--panel:#1b1f23;--txt:#e7e9ee;--muted:#98a2b3;--accent:#3b82f6;--bad:#ef4444;--ok:#22c55e;}
    html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .wrap{max-width:1100px;margin:24px auto;padding:0 16px}
    h1{margin:0 0 16px}
    .card{background:var(--panel);border-radius:12px;padding:16px;margin:16px 0;box-shadow:0 1px 0 rgba(255,255,255,.04), 0 8px 24px rgba(0,0,0,.35)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    label{display:block;font-weight:600;margin:4px 0}
    input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2a2f36;background:#0f1216;color:var(--txt)}
    textarea{min-height:120px}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    button{background:#222a36;border:1px solid #2c3442;color:var(--txt);padding:10px 14px;border-radius:10px;cursor:pointer}
    button.primary{background:var(--accent);border-color:#2c6eea;color:#fff}
    button.warn{background:#2a1b1b;border-color:#4d1c1c}
    .msg{margin-top:8px;font-weight:600}
    .msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)} .msg.note{color:var(--muted)}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:10px;border-bottom:1px solid #232a33}
    th{text-align:left;color:var(--muted);font-weight:600}
    .small{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Blog Manager</h1>

    <!-- Compose -->
    <div class="card">
      <h2>Post Details</h2>
      <div class="row">
        <div>
          <label for="title">Title *</label>
          <input id="title" placeholder="Post title" />
        </div>
        <div>
          <label for="slug">Slug</label>
          <input id="slug" placeholder="auto-generated if blank" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="summary">Summary</label>
          <textarea id="summary" placeholder="One or two compelling sentences..."></textarea>
        </div>
        <div>
          <label for="status">State</label>
          <select id="state">
            <option value="published" selected>Published</option>
            <option value="draft">Draft</option>
            <option value="archived">Archived</option>
          </select>
          <div class="small" style="margin-top:8px">Tip: “Publish Now” creates + publishes. “Save Draft (Server)” creates/updates as draft.</div>
        </div>
      </div>

      <div style="margin-top:12px">
        <label for="post-body">Content</label>
        <textarea id="post-body"></textarea>
      </div>

      <div class="actions">
        <button id="btn-save-draft-server">Save Draft (Server)</button>
        <button id="btn-generate-preview">Generate Preview</button>
        <button id="btn-publish" class="primary">Publish Now</button>
        <button id="btn-clear" class="warn">Clear</button>
      </div>
      <div id="compose-msg" class="msg note"></div>
    </div>

    <!-- Posts list -->
    <div class="card">
      <h2>Posts</h2>
      <div class="actions">
        <button id="btn-refresh">Refresh</button>
      </div>
      <div id="list-msg" class="msg note"></div>
      <table id="posts-table">
        <thead><tr><th>Title</th><th>Status</th><th>Updated</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- App logic -->
  <script src="./blog-manager.js"></script>

  <!-- TinyMCE init (after DOM + above HTML exist) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.tinymce) { console.error('TinyMCE failed to load'); return; }
      tinymce.init({
        selector: '#post-body',
        menubar: false,
        height: 380,
        plugins: 'lists link image table code',
        toolbar: 'undo redo | styles | bold italic underline | bullist numlist | link image | table | code'
      });
    });
  </script>
</body>
</html>

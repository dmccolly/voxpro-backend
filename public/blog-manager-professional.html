<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Blog Manager — Professional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    :root{
      --bg:#0f0f12; --panel:#151720; --ink:#e7e9ee; --muted:#9aa3b2; --accent:#7aa2ff; --ok:#2ecc71; --warn:#f39c12; --err:#ff6161; --edge:#222635;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font:14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif;
      color:var(--ink); background:linear-gradient(180deg,#0b0c10, #101217);
    }
    .wrap{max-width:1100px; margin:24px auto; padding:0 16px}
    .topbar{display:flex; align-items:center; gap:12px; margin-bottom:16px}
    .brand{font-weight:700; letter-spacing:.2px}
    .pill{padding:3px 8px; border:1px solid var(--edge); border-radius:999px; color:var(--muted)}
    .tabs{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 16px}
    .tab{
      appearance:none; border:1px solid var(--edge); background:var(--panel); color:var(--ink);
      padding:8px 12px; border-radius:10px; cursor:pointer; transition:.15s transform;
    }
    .tab:hover{transform:translateY(-1px)}
    .tab.active{border-color:var(--accent); outline:1px solid color-mix(in oklab, var(--accent) 40%, transparent)}
    .grid{display:grid; grid-template-columns:1.1fr .9fr; gap:16px}
    .card{
      background:var(--panel); border:1px solid var(--edge); border-radius:14px; overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,.25)
    }
    .card .hd{padding:10px 12px; border-bottom:1px solid var(--edge); color:var(--muted); display:flex; align-items:center; justify-content:space-between}
    .card .bd{padding:12px}
    .row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
    .row-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
    label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px}
    input[type="text"], input[type="datetime-local"], textarea{
      width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--edge); background:#0e1016; color:var(--ink);
    }
    textarea{min-height:160px; resize:vertical}
    .toolbar{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 10px}
    .btn{
      border:1px solid var(--edge); background:#0e1016; color:var(--ink); padding:8px 10px; border-radius:10px; cursor:pointer
    }
    .btn.primary{border-color:var(--accent)}
    .btn.ok{border-color:var(--ok)}
    .btn.warn{border-color:var(--warn)}
    .btn.ghost{background:transparent}
    .muted{color:var(--muted)}
    .preview{
      background:#0e1118; border:1px dashed var(--edge); border-radius:12px; padding:12px; min-height:180px
    }
    .preview img{max-width:100%; border-radius:10px; display:block; margin:8px 0}
    .list{display:flex; flex-direction:column; gap:10px}
    .item{
      border:1px solid var(--edge); border-radius:12px; padding:10px; background:#0d0f15;
      display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center;
    }
    .toast{
      position:fixed; right:16px; bottom:16px; background:#0b0d13; border:1px solid var(--edge); color:var(--ink);
      padding:10px 12px; border-radius:12px; opacity:0; transform:translateY(6px); transition:.2s; pointer-events:none;
    }
    .toast.show{opacity:1; transform:none}
    .status-dot{width:8px;height:8px;border-radius:999px;display:inline-block;margin-right:6px}
    .dot-draft{background:var(--muted)}
    .dot-scheduled{background:var(--warn)}
    .dot-published{background:var(--ok)}
    .hidden{display:none !important}
    @media (max-width:940px){.grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Blog Manager</div>
      <span class="pill">Pro</span>
      <span class="muted">Publish · Schedule · Preview</span>
    </div>

    <div class="tabs">
      <button class="tab active" data-panel="write">Write</button>
      <button class="tab" data-panel="posts">Posts</button>
      <button class="tab" data-panel="settings">Settings</button>
    </div>

    <!-- WRITE -->
    <section class="panel" id="panel-write">
      <div class="grid">
        <div class="card">
          <div class="hd"><span>Compose</span><span class="muted" id="dirtyFlag" hidden>unsaved</span></div>
          <div class="bd">
            <div class="row">
              <div>
                <label>Title</label>
                <input id="title" type="text" placeholder="Post title"/>
              </div>
              <div>
                <label>Slug</label>
                <input id="slug" type="text" placeholder="auto-from-title"/>
              </div>
            </div>

            <div class="row">
              <div>
                <label>Summary</label>
                <input id="summary" type="text" placeholder="Short teaser for cards & SEO"/>
              </div>
              <div>
                <label>Hero Image URL</label>
                <input id="hero" type="text" placeholder="https://..."/>
              </div>
            </div>

            <div class="toolbar">
              <button class="btn" data-cmd="bold"><b>B</b></button>
              <button class="btn" data-cmd="italic"><i>I</i></button>
              <button class="btn" data-cmd="underline"><u>U</u></button>
              <button class="btn" data-cmd="insertUnorderedList">• List</button>
              <button class="btn" data-cmd="createLink">Link</button>
              <button class="btn" id="fg">Text Color</button>
              <button class="btn" id="bg">Highlight</button>
              <button class="btn ghost" id="clearFmt">Clear</button>
            </div>

            <label>Body</label>
            <div id="body" contenteditable="true" style="border:1px solid var(--edge); border-radius:12px; padding:12px; min-height:260px; background:#0b0e14"></div>

            <div class="row-3" style="margin-top:12px">
              <button class="btn" id="saveDraft">Save Draft</button>
              <button class="btn warn" id="scheduleBtn">Schedule…</button>
              <button class="btn ok" id="publishBtn">Publish</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="hd"><span>Live Preview</span><span class="muted">updates as you type</span></div>
          <div class="bd">
            <div class="preview" id="preview">
              <h2 id="p-title" style="margin:0 0 6px 0">Title</h2>
              <div class="muted" id="p-slug">/posts/title</div>
              <img id="p-img" class="hidden" alt="hero"/>
              <p id="p-summary" class="muted">Summary appears here…</p>
              <hr style="border:none;border-top:1px solid var(--edge)"/>
              <article id="p-body" style="font-size:15px">Start writing…</article>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- POSTS -->
    <section class="panel hidden" id="panel-posts">
      <div class="card">
        <div class="hd">
          <span>Posts</span>
          <div>
            <select id="filter" class="btn">
              <option value="">All</option>
              <option value="draft">Draft</option>
              <option value="scheduled">Scheduled</option>
              <option value="published">Published</option>
            </select>
            <button class="btn" id="refresh">Refresh</button>
          </div>
        </div>
        <div class="bd">
          <div class="list" id="postList"></div>
        </div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section class="panel hidden" id="panel-settings">
      <div class="card">
        <div class="hd"><span>Settings</span></div>
        <div class="bd">
          <div class="row">
            <div>
              <label>Xano Base URL</label>
              <input id="cfgBase" type="text" placeholder="https://x8jk-abc-xyz.us-east-1.xano.io/api:YOUR_GROUP"/>
            </div>
            <div>
              <label>Xano API Key (if used)</label>
              <input id="cfgKey" type="text" placeholder="Bearer …"/>
            </div>
          </div>
          <div class="row">
            <div>
              <label>Collection (optional)</label>
              <input id="cfgCollection" type="text" placeholder="blog"/>
            </div>
            <div>
              <label>Preview Debounce (ms)</label>
              <input id="cfgDebounce" type="text" value="120"/>
            </div>
          </div>
          <button class="btn primary" id="saveCfg">Save Settings</button>
        </div>
      </div>
    </section>

    <div class="toast" id="toast">Saved</div>
  </div>

<script>
/* ======= CONFIG (single place) ======= */
const CONFIG = {
  XANO_API_BASE: "",    // e.g. "https://x8jk-abc-xyz.us-east-1.xano.io/api:BlogModeration"
  XANO_API_KEY: "",     // e.g. "Bearer xyz" or "" if not required
  COLLECTION: "blog",   // optional, if your routes are namespaced
  PREVIEW_DEBOUNCE_MS: 120
};

// Allow runtime override via window.__CONFIG (optional)
Object.assign(CONFIG, window.__CONFIG || {});

// Centralized endpoints (adjust here if your slugs differ)
const ENDPOINTS = {
  listPosts:    () => `${CONFIG.XANO_API_BASE}/posts`,
  createPost:   () => `${CONFIG.XANO_API_BASE}/posts`,
  updatePost:   (id) => `${CONFIG.XANO_API_BASE}/posts/${id}`,
  publishPost:  (id) => `${CONFIG.XANO_API_BASE}/posts/${id}/publish`,
  schedulePost: (id) => `${CONFIG.XANO_API_BASE}/posts/${id}/schedule`,
};

/* ======= tiny helpers ======= */
const $  = (sel, root=document)=>root.querySelector(sel);
const $$ = (sel, root=document)=>Array.from(root.querySelectorAll(sel));
const sleep = (ms)=> new Promise(r=>setTimeout(r,ms));
const headers = ()=> {
  const h = {"Content-Type":"application/json"};
  if (CONFIG.XANO_API_KEY) h["Authorization"] = CONFIG.XANO_API_KEY;
  return h;
}
const slugify = (s)=> (s||"")
  .toString().toLowerCase()
  .normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")
  .slice(0,96);

const debounce = (fn, ms=150)=>{
  let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); };
};

const toast = (msg, type="ok")=>{
  const el = $('#toast');
  el.textContent = msg;
  el.style.borderColor = (type==="err")? getComputedStyle(document.documentElement).getPropertyValue('--err') :
                          (type==="warn")? getComputedStyle(document.documentElement).getPropertyValue('--warn') :
                          getComputedStyle(document.documentElement).getPropertyValue('--edge');
  el.classList.add('show'); setTimeout(()=> el.classList.remove('show'), 2200);
};

/* ======= Tabs (your broken area) ======= */
$$('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    $$('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const target = btn.dataset.panel;
    // hide all panels
    $$('.panel').forEach(p=>p.classList.add('hidden'));
    // show the one matching the tab
    const panel = document.querySelector(`#panel-${target}`);
    if (panel) panel.classList.remove('hidden');
  });
});

/* ======= Editor & Preview ======= */
const state = {
  id: null, // null means new draft
  title: "", slug: "", summary: "", hero: "", body: "",
  dirty:false
};

// inputs
const titleEl = $('#title');
const slugEl  = $('#slug');
const sumEl   = $('#summary');
const heroEl  = $('#hero');
const bodyEl  = $('#body');

const pTitle = $('#p-title');
const pSlug  = $('#p-slug');
const pImg   = $('#p-img');
const pSum   = $('#p-summary');
const pBody  = $('#p-body');

const setDirty = (v=true)=>{
  state.dirty = v;
  $('#dirtyFlag').hidden = !v;
};

const updatePreview = ()=>{
  pTitle.textContent = titleEl.value || 'Title';
  pSlug.textContent  = `/posts/${slugEl.value || 'title'}`;
  const h = heroEl.value.trim();
  if (h){ pImg.src = h; pImg.classList.remove('hidden'); }
  else { pImg.classList.add('hidden'); }
  pSum.textContent   = sumEl.value || 'Summary appears here…';
  pBody.innerHTML    = bodyEl.innerHTML || 'Start writing…';
};

const syncSlugFromTitle = ()=>{
  if (!slugEl.dataset.manual){
    slugEl.value = slugify(titleEl.value);
  }
};

// events
titleEl.addEventListener('input', ()=>{
  syncSlugFromTitle(); setDirty(); previewTick();
});
slugEl.addEventListener('input', ()=>{ slugEl.dataset.manual = "1"; setDirty(); previewTick(); });
sumEl.addEventListener('input', ()=>{ setDirty(); previewTick(); });
heroEl.addEventListener('input', ()=>{ setDirty(); previewTick(); });
bodyEl.addEventListener('input', ()=>{ setDirty(); previewTick(); });

const previewTick = debounce(updatePreview, CONFIG.PREVIEW_DEBOUNCE_MS);

/* ======= Rich Text mini-toolbar (no external libs) ======= */
$$('.toolbar .btn[data-cmd]').forEach(b=>{
  b.addEventListener('click', ()=>{
    const cmd = b.dataset.cmd;
    if (cmd === 'createLink'){
      const url = prompt('URL to link to:');
      if (url) document.execCommand('createLink', false, url);
    } else {
      document.execCommand(cmd, false, null);
    }
    setDirty(); previewTick();
  });
});

// Foreground/background color pickers
$('#fg').addEventListener('click', ()=>{
  const c = prompt('Text color (#hex or name):','#e7e9ee');
  if (c) document.execCommand('foreColor', false, c);
  setDirty(); previewTick();
});
$('#bg').addEventListener('click', ()=>{
  const c = prompt('Highlight color:', '#2b344a');
  if (c) document.execCommand('hiliteColor', false, c);
  setDirty(); previewTick();
});
$('#clearFmt').addEventListener('click', ()=>{
  document.execCommand('removeFormat', false, null);
  setDirty(); previewTick();
});

/* ======= CRUD ======= */
async function api(url, options={}){
  const res = await fetch(url, {headers: headers(), ...options});
  if (!res.ok){
    const txt = await res.text().catch(()=> '');
    throw new Error(`HTTP ${res.status}: ${txt || res.statusText}`);
  }
  return res.headers.get('content-type')?.includes('application/json') ? res.json() : res.text();
}

function collectForm(){
  return {
    title: titleEl.value.trim(),
    slug: slugEl.value.trim() || slugify(titleEl.value),
    summary: sumEl.value.trim(),
    hero: heroEl.value.trim(),
    body_html: bodyEl.innerHTML.trim(),
    body_text: bodyEl.textContent.trim()
  };
}

async function saveDraft(){
  const payload = collectForm();
  let data;
  if (!payload.title) { toast('Title required', 'warn'); return; }
  try{
    if (state.id){
      data = await api(ENDPOINTS.updatePost(state.id), {method:'PUT', body: JSON.stringify(payload)});
    } else {
      data = await api(ENDPOINTS.createPost(), {method:'POST', body: JSON.stringify(payload)});
      state.id = data.id;
    }
    setDirty(false); toast('Draft saved');
    await loadPosts(); // keep list fresh
  }catch(e){ console.error(e); toast('Save failed', 'err'); }
}

async function publishNow(){
  try{
    if (!state.id) await saveDraft();
    await api(ENDPOINTS.publishPost(state.id), {method:'POST', body: JSON.stringify({published_at: new Date().toISOString()})});
    toast('Published');
    await loadPosts();
  }catch(e){ console.error(e); toast('Publish failed', 'err'); }
}

async function schedule(){
  if (!state.id) await saveDraft();
  const when = prompt('Publish at (local time, e.g. 2025-09-11 17:30):');
  if (!when) return;
  const iso = new Date(when.replace(' ','T')).toISOString();
  try{
    await api(ENDPOINTS.schedulePost(state.id), {method:'POST', body: JSON.stringify({publish_at: iso})});
    toast('Scheduled');
    await loadPosts();
  }catch(e){ console.error(e); toast('Schedule failed', 'err'); }
}

/* ======= Posts list ======= */
const listEl = $('#postList');
const filterEl = $('#filter');
$('#refresh').addEventListener('click', ()=> loadPosts());
filterEl.addEventListener('change', ()=> loadPosts());

function statusDot(s){
  if (s==='published') return '<span class="status-dot dot-published"></span>Published';
  if (s==='scheduled') return '<span class="status-dot dot-scheduled"></span>Scheduled';
  return '<span class="status-dot dot-draft"></span>Draft';
}

function renderPosts(items){
  listEl.innerHTML = '';
  if (!items?.length){
    listEl.innerHTML = '<div class="muted">No posts found.</div>'; return;
  }
  for (const it of items){
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <div>
        <div style="font-weight:600">${it.title || '(untitled)'} <span class="muted">/${it.slug}</span></div>
        <div class="muted" style="font-size:12px">${statusDot(it.status || 'draft')} · Updated ${new Date(it.updated_at || it.created_at).toLocaleString()}</div>
      </div>
      <div style="display:flex; gap:6px">
        <button class="btn" data-act="edit" data-id="${it.id}">Edit</button>
        ${it.status!=='published' ? `<button class="btn ok" data-act="pub" data-id="${it.id}">Publish</button>` : ''}
      </div>
    `;
    listEl.appendChild(div);
  }

  // actions
  $$('#postList .btn').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.dataset.id;
      const act = b.dataset.act;
      if (act==='edit'){
        try{
          const data = await api(`${ENDPOINTS.updatePost(id)}`, {method:'GET'});
          // Load into editor
          state.id = data.id;
          titleEl.value = data.title || '';
          slugEl.value  = data.slug || '';
          sumEl.value   = data.summary || '';
          heroEl.value  = data.hero || '';
          bodyEl.innerHTML = data.body_html || (data.body_text||'');
          setDirty(false);
          // switch to Write tab
          document.querySelector('.tab[data-panel="write"]').click();
          updatePreview();
          toast('Loaded');
        }catch(e){ console.error(e); toast('Load failed','err'); }
      } else if (act==='pub'){
        state.id = id;
        await publishNow();
      }
    });
  });
}

async function loadPosts(){
  try{
    const q = new URLSearchParams();
    const f = filterEl.value;
    if (f) q.set('status', f);
    const data = await api(`${ENDPOINTS.listPosts()}?${q.toString()}`);
    renderPosts(Array.isArray(data) ? data : data.items || []);
  }catch(e){ console.error(e); toast('Fetch failed','err'); }
}

/* ======= Settings ======= */
$('#cfgBase').value = CONFIG.XANO_API_BASE || '';
$('#cfgKey').value  = CONFIG.XANO_API_KEY || '';
$('#cfgCollection').value = CONFIG.COLLECTION || '';
$('#cfgDebounce').value = String(CONFIG.PREVIEW_DEBOUNCE_MS);

$('#saveCfg').addEventListener('click', ()=>{
  CONFIG.XANO_API_BASE = $('#cfgBase').value.trim();
  CONFIG.XANO_API_KEY  = $('#cfgKey').value.trim();
  CONFIG.COLLECTION    = $('#cfgCollection').value.trim() || CONFIG.COLLECTION;
  CONFIG.PREVIEW_DEBOUNCE_MS = parseInt($('#cfgDebounce').value||'120',10);
  toast('Settings saved');
});

/* ======= Buttons ======= */
$('#saveDraft').addEventListener('click', saveDraft);
$('#publishBtn').addEventListener('click', publishNow);
$('#scheduleBtn').addEventListener('click', schedule);

/* ======= Init ======= */
(async function init(){
  // Initial preview content
  updatePreview();
  // initial load
  await loadPosts();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VoxPro Companion</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg-primary:#0b1220;
      --bg-secondary:#1a2332;
      --bg-tertiary:#2a3441;
      --text-primary:#fff;
      --text-secondary:#b0bec5;
      --accent:#667eea;
    }
    html,body{height:100%;margin:0;background:var(--bg-primary);color:var(--text-primary);font:14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif}
    .vp-root{max-width:1100px;margin:0 auto;padding:16px}
    .vp-header{display:flex;align-items:center;gap:12px}
    .vp-header h1{font-size:18px;margin:0}
    .vp-actions{margin-left:auto;display:flex;gap:8px}
    .vp-btn{appearance:none;border:0;background:var(--accent);color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
    .vp-btn.secondary{background:#3b4a60}
    .vp-note{color:var(--text-secondary);margin:8px 0 16px}

    /* Breakout modal */
    #vp-breakout-backdrop{
      position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2147483647;
    }
    #vp-breakout-window{
      position:fixed;top:10vh;left:10vw;width:960px;height:540px;min-width:560px;min-height:360px;
      background:var(--bg-primary);border-radius:12px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.45);
      display:flex;flex-direction:column;z-index:2147483648;
    }
    #vp-breakout-header{
      display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;cursor:move;
      background:var(--bg-secondary);border-bottom:1px solid var(--bg-tertiary);user-select:none
    }
    #vp-breakout-title{font-weight:600}
    .vp-ctrls{display:flex;gap:6px}
    .vp-ctrls button{
      padding:4px 8px;border:0;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;font-size:.9rem
    }
    #vp-breakout-content{
      flex:1;background:var(--bg-tertiary);padding:12px;overflow:auto;resize:both
    }
    .vp-empty{
      color:var(--text-secondary);text-align:center;padding:24px
    }

    /* Example “inline” host area below (unchanged), just to demo pop-out */
    .vp-inline-player{
      background:var(--bg-secondary);border:1px solid var(--bg-tertiary);border-radius:12px;padding:12px;
    }
  </style>
</head>
<body>
  <div class="vp-root">
    <div class="vp-header">
      <h1>VoxPro Companion</h1>
      <div class="vp-actions">
        <!-- Example: a demo pop-out button you can remove -->
        <button class="vp-btn" id="vp-demo-popout">Pop-out Demo</button>
      </div>
    </div>
    <p class="vp-note">Player remains exactly as-is. This page only provides a movable, resizable modal to escape column constraints.</p>

    <!-- Your existing widget/keys/preview can continue to live “inline” wherever they already do.
         Nothing below is required for the breakout to work; it's just a demo host snippet. -->
    <div class="vp-inline-player" id="vp-inline">
      <!-- Put whatever your current player markup is here, or load it via your app. -->
      <video id="vp-demo-video" controls width="100%" src="" style="max-width:100%;border-radius:8px;"></video>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="vp-btn secondary" id="vp-load-sample">Load sample clip</button>
        <button class="vp-btn" id="vp-popout-inline">Pop-out this player</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      let backdrop = null;
      let winEl = null;
      let isMaxed = false;
      let prevRect = null;

      function ensureClosed(){
        try{ if(winEl && winEl._cleanup) winEl._cleanup(); } catch(_){}
        if(winEl && winEl.parentNode) winEl.parentNode.removeChild(winEl);
        if(backdrop && backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
        winEl = null; backdrop = null; isMaxed = false; prevRect = null;
      }

      function openBreakout(opts){
        // opts: { title, html, mediaUrl, currentTime, wasPlaying }
        ensureClosed();

        backdrop = document.createElement('div');
        backdrop.id = 'vp-breakout-backdrop';
        backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) closeBreakout(); });
        document.body.appendChild(backdrop);

        winEl = document.createElement('div');
        winEl.id = 'vp-breakout-window';
        document.body.appendChild(winEl);

        // Header
        const header = document.createElement('div');
        header.id = 'vp-breakout-header';

        const title = document.createElement('div');
        title.id = 'vp-breakout-title';
        title.textContent = opts?.title || 'VoxPro Player';

        const ctrls = document.createElement('div');
        ctrls.className = 'vp-ctrls';

        const btnMin = document.createElement('button');
        btnMin.title = 'Minimize';
        btnMin.textContent = '−';
        btnMin.onclick = () => content.style.display = 'none';

        const btnMax = document.createElement('button');
        btnMax.title = 'Maximize';
        btnMax.textContent = '□';
        btnMax.onclick = () => {
          if(!isMaxed){
            const r = winEl.getBoundingClientRect();
            prevRect = {x:r.left,y:r.top,w:r.width,h:r.height};
            winEl.style.left = '2vw';
            winEl.style.top  = '2vh';
            winEl.style.width = '96vw';
            winEl.style.height= '96vh';
            isMaxed = true; btnMax.textContent = '❐';
          }else{
            if(prevRect){
              winEl.style.left   = `${prevRect.x}px`;
              winEl.style.top    = `${prevRect.y}px`;
              winEl.style.width  = `${prevRect.w}px`;
              winEl.style.height = `${prevRect.h}px`;
            }
            isMaxed = false; btnMax.textContent = '□';
          }
          content.style.display = 'block';
        };

        const btnClose = document.createElement('button');
        btnClose.title = 'Close';
        btnClose.textContent = '×';
        btnClose.onclick = closeBreakout;

        ctrls.append(btnMin, btnMax, btnClose);
        header.append(title, ctrls);
        winEl.appendChild(header);

        // Content
        const content = document.createElement('div');
        content.id = 'vp-breakout-content';
        winEl.appendChild(content);

        // Populate content
        if (opts?.html) {
          content.innerHTML = opts.html;
        } else {
          content.innerHTML = `<div class="vp-empty">No content supplied — pass { html } or { mediaUrl }.</div>`;
        }

        // Optional: hydrate media url & state
        if (opts?.mediaUrl) {
          const media = content.querySelector('video, audio, img, iframe');
          if (media) {
            media.src = opts.mediaUrl;
            const av = content.querySelector('video, audio');
            if (av) {
              if (typeof opts.currentTime === 'number') av.currentTime = opts.currentTime;
              if (opts.wasPlaying) av.play?.().catch(()=>{});
            }
          }
        }

        // Dragging
        let dragging=false, offX=0, offY=0;
        header.addEventListener('mousedown', (e)=>{
          if(e.button!==0) return;
          dragging=true;
          const r = winEl.getBoundingClientRect();
          offX = e.clientX - r.left; offY = e.clientY - r.top;
          document.body.style.userSelect='none';
        });
        window.addEventListener('mousemove',(e)=>{
          if(!dragging || isMaxed) return;
          const x = Math.max(0, Math.min(window.innerWidth - winEl.offsetWidth,  e.clientX - offX));
          const y = Math.max(0, Math.min(window.innerHeight- winEl.offsetHeight, e.clientY - offY));
          winEl.style.left = `${x}px`;
          winEl.style.top  = `${y}px`;
        });
        window.addEventListener('mouseup',()=>{
          dragging=false; document.body.style.userSelect='';
        });

        const escHandler = (e)=>{
          if(e.key === 'Escape'){ e.preventDefault(); closeBreakout(); }
        };
        window.addEventListener('keydown', escHandler);

        // Cleanup handle
        winEl._cleanup = () => window.removeEventListener('keydown', escHandler);
      }

      function closeBreakout(){ ensureClosed(); }

      // Public API
      window.VoxProBreakout = {
        open: openBreakout,
        close: closeBreakout
      };

      // ---- OPTIONAL DEMO WIRING (remove if you don’t want it in this file) ----
      const demoBtn = document.getElementById('vp-demo-popout');
      const popInline = document.getElementById('vp-popout-inline');
      const loadSample = document.getElementById('vp-load-sample');
      const demoVid = document.getElementById('vp-demo-video');

      if (loadSample && demoVid) {
        loadSample.addEventListener('click', ()=>{
          // Replace with one of your Cloudinary/asset URLs; this is just a placeholder.
          demoVid.src = 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm';
          demoVid.play().catch(()=>{});
        });
      }

      function cloneInlineMarkup(){
        // Example of popping out the EXACT current inline player markup
        const inline = document.getElementById('vp-inline');
        if (!inline) return { html:'', url:null, t:0, playing:false };
        const av = inline.querySelector('video,audio');
        const playing = !!(av && !av.paused);
        const t = av ? av.currentTime : 0;
        const url = av ? av.currentSrc || av.src : null;
        return { html:inline.querySelector('.vp-inline-player') ? inline.querySelector('.vp-inline-player').innerHTML : inline.innerHTML, url, t, playing };
      }

      function popOutInline(){
        const { html, url, t, playing } = cloneInlineMarkup();
        openBreakout({ title:'VoxPro Player', html, mediaUrl:url, currentTime:t, wasPlaying:playing });
      }

      if (demoBtn) demoBtn.addEventListener('click', popOutInline);
      if (popInline) popInline.addEventListener('click', popOutInline);
      // ------------------------------------------------------------------------
    })();
  </script>
</body>
</html>

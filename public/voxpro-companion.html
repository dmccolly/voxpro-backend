<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoxPro Companion Player</title>

<!-- Optional libs for document previews (kept for parity with your stack) -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>

<style>
  :root{
    --bg-primary:#0b1220; --bg-secondary:#1a2332; --bg-tertiary:#2a3441;
    --text-primary:#ffffff; --text-secondary:#b0bec5; --accent:#667eea; --accent2:#764ba2;
    --success:#4caf50; --error:#f44336;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif;background:var(--bg-primary);color:var(--text-primary)}

  .companion-player{width:400px;max-width:100%;background:var(--bg-secondary);border:1px solid var(--bg-tertiary);border-radius:12px;overflow:visible;box-shadow:0 8px 32px rgba(0,0,0,.3)}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg-primary);border-bottom:1px solid var(--bg-tertiary);border-radius:12px 12px 0 0}
  .modal-title{font-size:.9rem;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .controls{display:flex;gap:6px}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:4px;cursor:pointer;padding:4px 8px;font-weight:600}
  .btn:hover{background:var(--accent2)}
  .content{padding:14px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .status{display:inline-flex;align-items:center;gap:8px;margin:12px 14px}
  .status.connected{color:var(--success);background:rgba(76,175,80,.15);padding:6px 10px;border-radius:14px}
  .status.disconnected{color:var(--error);background:rgba(244,67,54,.15);padding:6px 10px;border-radius:14px}
  .keys{padding:12px 14px 18px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .key{background:var(--bg-tertiary);border:2px solid var(--bg-tertiary);border-radius:8px;color:var(--text-primary);padding:12px;cursor:pointer;font-weight:700}
  .key.playing{outline:2px solid var(--success)}
  .stop{grid-column:1/-1;background:var(--error);border:none;border-radius:8px;color:#fff;padding:12px;cursor:pointer}
  @media (max-width:768px){ .grid{grid-template-columns:1fr} }

  /* Parent/local overlay styles */
  .vp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2147483647;display:flex;align-items:center;justify-content:center}
  .vp-window{width:90vw;height:90vh;max-width:1200px;max-height:800px;background:#1a2332;border-radius:8px;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.5)}
  .vp-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0b1220;border-radius:8px 8px 0 0;border-bottom:1px solid #2a3441}
  .vp-title{color:#fff;font-weight:600}
  .vp-close{background:#667eea;color:#fff;border:0;border-radius:4px;cursor:pointer;width:32px;height:32px;font-size:18px;font-weight:700}
  .vp-body{flex:1;padding:20px;display:flex;align-items:center;justify-content:center;overflow:auto}
</style>
</head>
<body>
  <div class="companion-player" id="root">
    <div class="modal-header">
      <div class="modal-title" id="title">VoxPro Player</div>
      <div class="controls">
        <button class="btn" id="minBtn" title="Minimize">–</button>
        <button class="btn" id="maxBtn" title="Maximize">□</button>
        <button class="btn" id="closeBtn" title="Close">×</button>
      </div>
    </div>
    <div class="content" id="content">
      <div style="font-size:2rem;opacity:.8;margin-bottom:8px">🎵</div>
      <div>Press a key to play media</div>
    </div>

    <div class="status disconnected" id="conn"><span id="connText">Disconnected</span></div>

    <div class="keys">
      <div class="grid">
        <button class="key" data-key="1" id="k1">KEY 1</button>
        <button class="key" data-key="2" id="k2">KEY 2</button>
        <button class="key" data-key="3" id="k3">KEY 3</button>
        <button class="key" data-key="4" id="k4">KEY 4</button>
        <button class="key" data-key="5" id="k5">KEY 5</button>
        <button class="stop" id="stopBtn">STOP</button>
      </div>
    </div>
  </div>

<script>
  // ---------------------------
  // Config: Netlify function endpoints
  // ---------------------------
  const CFG = {
    LIST_MEDIA: '/.netlify/functions/list-media',
    ASSIGNMENTS: '/.netlify/functions/xano-proxy/voxpro_assignments'
  };

  // ---------------------------
  // State
  // ---------------------------
  const S = {
    assignments: [],
    media: [],
    playing: null,        // {key, id, url, title}
    connected: false
  };

  // ---------------------------
  // Elements
  // ---------------------------
  const E = {
    title: document.getElementById('title'),
    content: document.getElementById('content'),
    conn: document.getElementById('conn'),
    connText: document.getElementById('connText'),
    minBtn: document.getElementById('minBtn'),
    maxBtn: document.getElementById('maxBtn'),
    closeBtn: document.getElementById('closeBtn'),
    keys: [1,2,3,4,5].map(n => document.getElementById('k'+n)),
    stopBtn: document.getElementById('stopBtn')
  };

  function setConn(connected){
    S.connected = connected;
    E.conn.className = 'status ' + (connected ? 'connected':'disconnected');
    E.connText.textContent = connected ? 'Connected' : 'Disconnected';
  }

  // ---------------------------
  // Data
  // ---------------------------
  async function loadAssignments(){
    try{
      const r = await fetch(CFG.ASSIGNMENTS, {headers:{'Accept':'application/json'}});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const data = await r.json();
      S.assignments = Array.isArray(data) ? data : [];
      setConn(true);
    }catch(e){
      console.error('assignments error', e);
      setConn(false);
    }
  }

  async function loadMedia(){
    try{
      const r = await fetch(CFG.LIST_MEDIA, {cache:'no-cache'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const data = await r.json();
      S.media = Array.isArray(data) ? data : [];
      setConn(true);
    }catch(e){
      console.error('media error', e);
      setConn(false);
    }
  }

  function urlFromAssignment(a){
    return a?.asset?.cloudinary_url || a?.asset?.file_url || a?.asset?.media_url || a?.cloudinary_url || a?.file_url || null;
  }

  // ---------------------------
  // Playback
  // ---------------------------
  function clearPlaying(){
    E.keys.forEach(btn => btn.classList.remove('playing'));
    S.playing = null;
  }

  function stopLocalPlayback(){
    E.content.querySelectorAll('audio,video').forEach(el=>{
      try{ el.pause(); el.removeAttribute('src'); el.load?.(); }catch(_){}
    });
  }

  function renderInline(type,url){
    E.content.innerHTML = '';
    let el;
    if((type||'').toLowerCase().includes('video')){
      el = document.createElement('video'); el.controls=true; el.autoplay=true; el.style.width='100%';
    }else if((type||'').toLowerCase().includes('image')){
      el = document.createElement('img'); el.style.maxWidth='100%';
    }else{
      el = document.createElement('audio'); el.controls=true; el.autoplay=true;
    }
    el.src=url; E.content.appendChild(el);
    return el;
  }

  async function playForKey(n){
    const a = S.assignments.find(x => parseInt(x.key_number)===parseInt(n));
    if(!a){ console.warn('no assignment for key', n); return; }
    const u = urlFromAssignment(a);
    if(!u){ console.warn('no media url'); return; }

    clearPlaying();
    const btn = E.keys.find(b=>b.dataset?.key===String(n)) || document.getElementById('k'+n);
    btn?.classList.add('playing');

    const type = a.file_type || a.asset?.file_type || '';
    renderInline(type,u);
    S.playing = { key:n, id:a.id, url:u, title:(a.title || a.asset?.title || 'VoxPro Player') };
  }

  function stopPlayback(){
    stopLocalPlayback(); clearPlaying();
    E.content.innerHTML = '<div style="opacity:.7">Media stopped</div>';
  }

  // ---------------------------
  // Overlay (parent or local)
  // ---------------------------
  function openOverlayIn(doc, url, title){
    const existing = doc.getElementById('voxpro-overlay');
    if(existing) existing.remove(); // ensure single instance

    const ov = doc.createElement('div'); ov.id='voxpro-overlay';
    ov.className='vp-overlay';
    const win = doc.createElement('div'); win.className='vp-window';
    const hd  = doc.createElement('div'); hd.className='vp-header';
    const tt  = doc.createElement('div'); tt.className='vp-title'; tt.textContent = title || 'VoxPro Player';
    const cl  = doc.createElement('button'); cl.className='vp-close'; cl.textContent='×';
    const bd  = doc.createElement('div'); bd.className='vp-body';
    hd.appendChild(tt); hd.appendChild(cl); win.appendChild(hd); win.appendChild(bd); ov.appendChild(win); (doc.body||doc.documentElement).appendChild(ov);

    const a = doc.createElement('audio'); a.controls=true; a.autoplay=true; a.src=url; a.style.maxWidth='100%';
    bd.appendChild(a);
    cl.onclick = ()=> ov.remove();
    doc.addEventListener('keydown', e=>{ if(e.key==='Escape') ov.remove(); }, {once:true});
  }

  function parentOpenOverlay(url, title){
    if(window.parent && window.parent !== window){
      window.parent.postMessage({ type:'VP_OVERLAY_OPEN', payload:{ url, title } }, '*');
    }else{
      openOverlayIn(document, url, title);
    }
  }

  // Parent bootstrap (installed once)
  (function setupParent(){
    if(!(window.parent && window.parent !== window)) return;
    window.parent.postMessage({ type:'VP_BOOTSTRAP' }, '*');
  })();

  // Local listener (rarely used, kept for completeness)
  window.addEventListener('message', ev=>{
    if(!ev || !ev.data) return;
    if(ev.data.type==='VP_OVERLAY_OPEN_LOCAL' && ev.data.payload){
      openOverlayIn(document, ev.data.payload.url, ev.data.payload.title);
    }
  });

  // ---------------------------
  // Controls
  // ---------------------------
  function wire(){
    E.minBtn.onclick = ()=>{ const h=E.content; h.style.display='none'; E.minBtn.style.display='none'; };
    E.closeBtn.onclick = ()=>{ stopPlayback(); E.content.style.display=''; E.minBtn.style.display=''; };

    E.maxBtn.onclick = ()=>{
      if(!(S.playing && S.playing.url)){ console.warn('maximize: no active media'); return; }
      // prevent duplicate audio: stop inline media before opening overlay
      stopLocalPlayback();
      parentOpenOverlay(S.playing.url, S.playing.title);
    };

    E.keys.forEach(btn=>{
      btn.dataset.key = btn.id.replace('k','');
      btn.onclick = ()=> playForKey(btn.dataset.key);
    });
    E.stopBtn.onclick = stopPlayback;
  }

  // ---------------------------
  // Init
  // ---------------------------
  (async function init(){
    wire();
    try{
      await Promise.all([loadMedia(), loadAssignments()]);
    }catch(e){ console.error(e); }
    setConn(S.connected);

    // Parent overlay handler injection (idempotent)
    if(window.parent && window.parent !== window){
      window.parent.postMessage({
        type:'VP_PARENT_INSTALL',
        script: `
          (function(){
            if(window.__vpOverlayInstalled) return;
            window.__vpOverlayInstalled = true;

            window.addEventListener('message', function(ev){
              if(!ev || !ev.data) return;

              if(ev.data.type === 'VP_BOOTSTRAP'){
                // acknowledge (optional)
                window.postMessage({ type:'VP_PARENT_READY' }, '*');
              }

              if(ev.data.type === 'VP_OVERLAY_OPEN' && ev.data.payload){
                var p = ev.data.payload;
                var ex = document.getElementById('voxpro-overlay');
                if(ex) ex.remove();
                var d=document, ov=d.createElement('div'); ov.id='voxpro-overlay'; ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2147483647;display:flex;align-items:center;justify-content:center';
                var win=d.createElement('div'); win.style.cssText='width:90vw;height:90vh;max-width:1200px;max-height:800px;background:#1a2332;border-radius:8px;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.5)';
                var hd=d.createElement('div'); hd.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0b1220;border-radius:8px 8px 0 0;border-bottom:1px solid #2a3441';
                var tt=d.createElement('div'); tt.textContent=p.title||'VoxPro Player'; tt.style.cssText='color:#fff;font-weight:600';
                var cl=d.createElement('button'); cl.textContent='×'; cl.style.cssText='background:#667eea;color:#fff;border:0;border-radius:4px;width:32px;height:32px;cursor:pointer;font-size:18px;font-weight:700';
                var bd=d.createElement('div'); bd.style.cssText='flex:1;padding:20px;display:flex;align-items:center;justify-content:center;overflow:auto';
                hd.appendChild(tt); hd.appendChild(cl); win.appendChild(hd); win.appendChild(bd); ov.appendChild(win); (d.body||d.documentElement).appendChild(ov);
                var a=d.createElement('audio'); a.controls=true; a.autoplay=true; a.src=p.url; a.style.maxWidth='100%'; bd.appendChild(a);
                cl.onclick=function(){ ov.remove(); };
              }

              if(ev.data.type === 'VP_OVERLAY_CLOSE'){
                var ex = document.getElementById('voxpro-overlay');
                if(ex) ex.remove();
              }
            });
          })();`
      }, '*');
    }
  })();
</script>
</body>
</html>

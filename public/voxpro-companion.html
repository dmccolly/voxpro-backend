<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VoxPro Companion</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg0:#0b1220; --bg1:#172033; --bg2:#0f1728;
      --ink:#e6eef7; --muted:#a9b6c6; --line:#2a3441; --accent:#667eea;
    }
    html,body{height:100%;margin:0;background:var(--bg0);color:var(--ink);
      font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .wrap{max-width:1200px;margin:0 auto;padding:12px}
    .bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .title{font-weight:600}
    .spacer{flex:1}
    .btn{appearance:none;border:0;border-radius:8px;background:var(--accent);color:#fff;padding:8px 12px;cursor:pointer}
    .btn.secondary{background:#3b4a60}
    .note{font-size:12px;color:var(--muted)}

    /* Widget frame */
    #vp-widget-shell{
      position:relative;
      background:var(--bg1);
      border:1px solid var(--line);
      border-radius:12px;
      overflow:hidden;
    }

    /* Fallback “windowed” modal (only used if fullscreen not permitted) */
    #vp-fallback-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2147483647;display:none}
    #vp-fallback-win{
      position:fixed;top:8vh;left:8vw;width:min(84vw,1200px);height:min(84vh,800px);
      background:var(--bg2);border:1px solid var(--line);border-radius:12px;
      box-shadow:0 24px 80px rgba(0,0,0,.45);overflow:hidden;display:none;z-index:2147483648;
    }
    #vp-fb-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
      padding:10px 12px;background:var(--bg1);border-bottom:1px solid var(--line);cursor:move;user-select:none}
    #vp-fb-title{font-weight:600}
    #vp-fb-body{position:relative;height:calc(100% - 46px);overflow:auto;background:var(--bg2)}
    #vp-fb-resize{position:absolute;right:6px;bottom:6px;width:16px;height:16px;cursor:nwse-resize;opacity:.85}
    #vp-fb-resize:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 0 50%,#fff 50% 100%);opacity:.35}

    /* Embed area for your existing widget UI */
    #voxpro-widget-root{ /* your actual widget container lives INSIDE this */ }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div class="title">VoxPro Companion</div>
      <div class="spacer"></div>
      <button class="btn" id="btnPop">Pop-out</button>
      <button class="btn secondary" id="btnCloseFS">Close</button>
    </div>
    <div class="note">Pop-out uses native Fullscreen when embedded on other sites; Esc exits. If fullscreen is blocked, a movable, resizable window appears as a fallback (within the iframe bounds).</div>

    <!-- Your existing widget stays exactly as-is, mounted INSIDE this shell -->
    <div id="vp-widget-shell">
      <div id="voxpro-widget-root">
        <!-- ⤵️ DO NOT change your widget markup; it already renders here today -->
        <!-- If a bundle mounts it, keep your existing script tags below -->
      </div>
    </div>
  </div>

  <!-- If your widget relies on bundles, keep them here as they already are -->
  <!-- Example:
  <script src="/static/js/bundle.js" defer></script>
  <script src="/assets/voxpro.js" defer></script>
  -->

  <!-- Fallback modal DOM (only used if fullscreen not allowed) -->
  <div id="vp-fallback-mask"></div>
  <div id="vp-fallback-win" aria-modal="true" role="dialog">
    <div id="vp-fb-head">
      <div id="vp-fb-title">VoxPro</div>
      <div style="display:flex;gap:6px">
        <button class="btn secondary" id="fbMin">−</button>
        <button class="btn secondary" id="fbMax">□</button>
        <button class="btn" id="fbClose">×</button>
      </div>
    </div>
    <div id="vp-fb-body">
      <!-- We DO NOT move your DOM. We mirror the shell using a cloned CSS box. -->
      <iframe id="fbMirror" title="VoxPro (fallback view)" style="width:100%;height:100%;border:0"></iframe>
      <div id="vp-fb-resize" aria-hidden="true"></div>
    </div>
  </div>

  <script>
  (function(){
    const shell = document.getElementById('vp-widget-shell');
    const pop = document.getElementById('btnPop');
    const closeFS = document.getElementById('btnCloseFS');

    // Fallback modal bits
    const fbMask  = document.getElementById('vp-fallback-mask');
    const fbWin   = document.getElementById('vp-fallback-win');
    const fbHead  = document.getElementById('vp-fb-head');
    const fbBody  = document.getElementById('vp-fb-body');
    const fbTitle = document.getElementById('vp-fb-title');
    const fbClose = document.getElementById('fbClose');
    const fbMin   = document.getElementById('fbMin');
    const fbMax   = document.getElementById('fbMax');
    const fbMirror= document.getElementById('fbMirror');
    const fbResize= document.getElementById('vp-fb-resize');

    // ---- Fullscreen helpers ----
    function canFullscreen() {
      // In iframes, browser requires allowfullscreen/allow="fullscreen" on the iframe element.
      // We try anyway; if it throws/rejects, we fall back.
      return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled || document.mozFullScreenEnabled || document.msFullscreenEnabled);
    }
    function requestFS(el){
      return (el.requestFullscreen?.() || el.webkitRequestFullscreen?.() || el.mozRequestFullScreen?.() || el.msRequestFullscreen?.()) ?? Promise.reject();
    }
    function exitFS(){
      return (document.exitFullscreen?.() || document.webkitExitFullscreen?.() || document.mozCancelFullScreen?.() || document.msExitFullscreen?.());
    }
    function isFS(){
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
    }

    async function openPopout(){
      // Prefer native fullscreen for a true “escape the column/iframe” result
      try {
        if (canFullscreen()) {
          await requestFS(shell);
          return;
        }
      } catch(_) { /* fall through to fallback */ }
      openFallback();
    }

    function closePopout(){
      if (isFS()) { try{ exitFS(); }catch(_){} }
      closeFallback();
    }

    pop.addEventListener('click', openPopout);
    closeFS.addEventListener('click', closePopout);
    document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closePopout(); });

    // ---- Fallback movable/resizable window (within iframe bounds) ----
    function openFallback(){
      // Mirror the current page into an iframe so your widget looks the same without touching DOM
      // (Same-origin: it’s our own file; the iframe just points to the current URL.)
      try { fbMirror.src = window.location.href; } catch(_) {}
      fbMask.style.display = 'block';
      fbWin.style.display  = 'flex';
    }
    function closeFallback(){
      fbMask.style.display = 'none';
      fbWin.style.display  = 'none';
      try { fbMirror.src = 'about:blank'; } catch(_){}
    }

    // drag
    let drag=null, maxed=false, prevRect=null;
    fbHead.addEventListener('mousedown', (e)=>{
      if (e.button!==0) return;
      const r=fbWin.getBoundingClientRect();
      drag={dx:e.clientX-r.left, dy:e.clientY-r.top};
      document.body.style.userSelect='none';
    });
    window.addEventListener('mousemove',(e)=>{
      if(!drag || maxed) return;
      const x=Math.max(0,Math.min(window.innerWidth - fbWin.offsetWidth,  e.clientX-drag.dx));
      const y=Math.max(0,Math.min(window.innerHeight- fbWin.offsetHeight, e.clientY-drag.dy));
      fbWin.style.left=x+'px'; fbWin.style.top=y+'px';
    });

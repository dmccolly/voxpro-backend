<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxPro Companion Player</title>
    
    <!-- PDF.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    
    <!-- Mammoth.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    
    <style>
        :root {
            --bg-primary: #0b1220;
            --bg-secondary: #1a2332;
            --bg-tertiary: #2a3441;
            --accent: #667eea;
            --accent-secondary: #764ba2;
            --text-primary: #ffffff;
            --text-secondary: #b0bec5;
            --text-accent: #667eea;
            --success: #4caf50;
            --error: #f44336;
            --warning: #ff9800;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Companion player container styles.  Ensure the breakout modal
           can escape the 400 px frame by allowing overflow to be visible. */
        .companion-player {
            width: 400px;
            max-width: 100%;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--bg-tertiary);
            overflow: visible; /* was hidden */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Modal Player Section */
        .modal-section {
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--bg-primary);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--bg-tertiary);
            border-radius: 12px 12px 0 0;
        }

        .modal-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-controls { display: flex; gap: 4px; }

        .modal-btn {
            padding: 4px 8px;
            background: var(--accent);
            border: none;
            border-radius: 3px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
            min-width: 24px;
        }
        .modal-btn:hover { background: var(--accent-secondary); }

        .modal-content {
            padding: 12px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .modal-placeholder { text-align: center; color: var(--text-secondary); }
        .placeholder-icon { font-size: 2rem; margin-bottom: 8px; }
        .placeholder-text { font-size: 0.85rem; }

        .modal-content video,
        .modal-content audio {
            width: 100%;
            max-height: 200px;
            border-radius: 6px;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
        }

        .modal-content iframe {
            width: 100%;
            height: 200px;
            border: none;
            border-radius: 6px;
        }

        .description-overlay {
            margin-top: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-primary);
            width: 100%;
            text-align: left;
        }

        /* Maximized state (legacy local maximize) */
        .modal-section.maximized {
            position: fixed;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            z-index: 1000;
            border-radius: 8px;
            background: var(--bg-primary);
        }
        .modal-section.maximized .modal-content {
            height: calc(100% - 40px);
            padding: 20px;
        }
        .modal-section.maximized .modal-content video {
            max-height: none; height: calc(100% - 60px);
        }

        /* Minimized state */
        .modal-section.minimized .modal-content { display: none; }

        /* Keys Section */
        .keys-section { padding: 12px; }
        .keys-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .keys-title { font-size: 1rem; font-weight: 600; color: var(--text-accent); }

        .stop-btn {
            padding: 6px 12px; background: var(--error); border: none; border-radius: 4px;
            color: white; cursor: pointer; font-size: 0.8rem; font-weight: 600;
        }
        .stop-btn:hover { background: #d32f2f; }

        .keys-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
        .keys-row-2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 12px; }

        .key-button {
            background: var(--bg-tertiary);
            border: 2px solid var(--bg-tertiary);
            border-radius: 6px; padding: 8px 4px; cursor: pointer; transition: all 0.2s ease;
            text-align: center; min-height: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .key-button:hover { border-color: var(--accent); background: rgba(102, 126, 234, 0.1); }
        .key-button.playing { border-color: var(--success); background: rgba(76, 175, 80, 0.1); }

        .key-number { font-size: 0.9rem; font-weight: bold; color: var(--text-accent); margin-bottom: 2px; }
        .key-title { font-size: 0.7rem; color: var(--text-secondary); line-height: 1.2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        /* Keys Assigned List */
        .keys-list { background: var(--bg-primary); border-radius: 6px; padding: 8px; }
        .keys-list-title { font-size: 0.85rem; font-weight: 600; color: var(--text-accent); margin-bottom: 6px; }

        .key-item { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--bg-tertiary); }
        .key-item:last-child { border-bottom: none; }
        .key-item-number { font-size: 0.75rem; font-weight: bold; color: var(--text-accent); min-width: 20px; text-align: center; background: var(--bg-tertiary); border-radius: 3px; padding: 2px 4px; }
        .key-item-content { flex: 1; }
        .key-item-title { font-size: 0.75rem; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
        .key-item-description { font-size: 0.7rem; color: var(--text-secondary); line-height: 1.3; }

        /* Status Messages */
        .status-message {
            position: fixed; top: 20px; right: 20px; padding: 12px 16px; border-radius: 6px; color: white;
            font-size: 0.9rem; z-index: 1001; opacity: 0; transform: translateX(100%); transition: all 0.3s ease;
        }
        .status-message.show { opacity: 1; transform: translateX(0); }
        .status-message.success { background: var(--success); }
        .status-message.error   { background: var(--error); }
        .status-message.warning { background: var(--warning); }

        /* Parent/local overlay used by maximize */
        .vp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2147483647;display:flex;align-items:center;justify-content:center}
        .vp-window{width:90vw;height:90vh;max-width:1200px;max-height:800px;background:#1a2332;border-radius:8px;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.5)}
        .vp-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0b1220;border-radius:8px 8px 0 0;border-bottom:1px solid #2a3441}
        .vp-title{color:#fff;font-weight:600}
        .vp-close{background:#667eea;color:#fff;border:0;border-radius:4px;cursor:pointer;width:32px;height:32px;font-size:18px;font-weight:700}
        .vp-body{flex:1;padding:20px;display:flex;align-items:center;justify-content:center;overflow:auto}
    </style>
</head>
<body>
    <div class="companion-player" id="companionPlayer">
        <!-- Modal Player Section -->
        <div class="modal-section" id="modalSection">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">VoxPro Player</span>
                <div class="modal-controls">
                    <button class="modal-btn" id="minimizeBtn" title="Minimize">−</button>
                    <button class="modal-btn" id="maximizeBtn" title="Maximize">□</button>
                    <button class="modal-btn" id="closeBtn" title="Close">×</button>
                </div>
            </div>
            <div class="modal-content" id="modalContent">
                <div class="modal-placeholder">
                    <div class="placeholder-icon">🎵</div>
                    <div class="placeholder-text">Press a key to play media</div>
                </div>
            </div>
        </div>

        <!-- Keys Section -->
        <div class="keys-section">
            <div class="keys-header"><span class="keys-title">VoxPro Keys</span></div>
            <div class="keys-grid" id="keysGrid"></div>
            <div class="keys-row-2" id="keysRow2"></div>

            <div class="keys-list">
                <div class="keys-list-title">Keys Assigned</div>
                <div id="keysList"></div>
            </div>
        </div>
    </div>

    <!-- Status Messages -->
    <div class="status-message" id="statusMessage"></div>

    <script>
        // VoxPro Companion Player JavaScript
        const state = {
            assignments: [],
            mediaList: [],
            playing: null,
            currentModal: null,
            modalState: 'normal' // normal, minimized, maximized, breakout
        };

        const elements = {
            modalSection:  document.getElementById('modalSection'),
            modalTitle:    document.getElementById('modalTitle'),
            modalContent:  document.getElementById('modalContent'),
            minimizeBtn:   document.getElementById('minimizeBtn'),
            maximizeBtn:   document.getElementById('maximizeBtn'),
            closeBtn:      document.getElementById('closeBtn'),
            stopBtn:       document.getElementById('stopBtn'),
            keysGrid:      document.getElementById('keysGrid'),
            keysList:      document.getElementById('keysList'),
            statusMessage: document.getElementById('statusMessage')
        };

        // Determine fullscreen request (?fullscreen=1&key=3)
        const urlParams      = new URLSearchParams(window.location.search);
        const fullscreenMode = urlParams.get('fullscreen') === '1';
        const autoPlayKey    = urlParams.get('key');

        async function initCompanionPlayer() {
            try {
                await loadMediaList();
                await loadAssignments();
                renderKeys();
                renderKeysList();
                attachEventListeners();
                createParentWindowHandler();
                showMessage('success', 'VoxPro Companion Player Ready');

                // Fullscreen mode sizing + optional autoplay
                if (fullscreenMode) {
                    const playerContainer = document.querySelector('.companion-player');
                    if (playerContainer) {
                        playerContainer.style.width = '90vw';
                        playerContainer.style.maxWidth = '90vw';
                        playerContainer.style.height = '90vh';
                        playerContainer.style.maxHeight = '90vh';
                    }
                    if (autoPlayKey) {
                        setTimeout(() => {
                            const keyNum = parseInt(autoPlayKey, 10);
                            if (!isNaN(keyNum)) playForKey(keyNum);
                        }, 300);
                    }
                }
            } catch (error) {
                console.error('Failed to initialize companion player:', error);
                showMessage('error', 'Failed to load VoxPro data');
            }
        }

        // Load assignments from API
        async function loadAssignments() {
            try {
                const response = await fetch('/.netlify/functions/xano-proxy/voxpro_assignments', {
                    method: 'GET', headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);

                const data = await response.json();
                const assignments = Array.isArray(data) ? data : [];

                // Enrich with media list metadata
                const enriched = assignments.map(a => {
                    const m = state.mediaList.find(x => x.id === a.asset_id);
                    return {
                        ...a,
                        title:       a.title       || m?.title || 'Unknown',
                        description: a.description || m?.description || '',
                        cloudinary_url: a.cloudinary_url || m?.cloudinary_url || m?.file_url || m?.database_url || m?.media_url,
                        file_type:      a.file_type      || m?.file_type || ''
                    };
                });

                state.assignments = enriched;
            } catch (error) {
                console.error('Load assignments error:', error);
                state.assignments = [];
            }
        }

        // Load media list from API (using your existing proxy/data path)
        async function loadMediaList() {
            try {
                const response = await fetch('/.netlify/functions/xano-proxy/user_submission', {
                    method: 'GET', headers: { 'Accept': 'application/json' }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);

                const data = await response.json();
                state.mediaList = Array.isArray(data) ? data.map(item => ({
                    ...item,
                    title: item.title || item.name || 'Untitled',
                    description: item.description || '',
                    file_type: item.file_type || 'unknown'
                })) : [];
            } catch (error) {
                console.error('Error loading media list:', error);
                state.mediaList = [];
            }
        }

        // Render key buttons
        function renderKeys() {
            const keysGrid = elements.keysGrid;
            const keysRow2 = document.getElementById('keysRow2');
            keysGrid.innerHTML = '';
            keysRow2.innerHTML = '';

            // Keys 1–3
            for (let i = 1; i <= 3; i++) {
                const a = state.assignments.find(x => parseInt(x.key_number) === i);
                const btn = document.createElement('div');
                btn.className = 'key-button';
                btn.id = `key${i}`;
                btn.onclick = () => playForKey(i);

                const num = document.createElement('div');
                num.className = 'key-number';
                num.textContent = i;

                const title = document.createElement('div');
                title.className = 'key-title';
                title.textContent = a ? (a.title || 'Untitled') : 'Empty';

                btn.appendChild(num);
                btn.appendChild(title);
                keysGrid.appendChild(btn);
            }

            // Keys 4–5
            for (let i = 4; i <= 5; i++) {
                const a = state.assignments.find(x => parseInt(x.key_number) === i);
                const btn = document.createElement('div');
                btn.className = 'key-button';
                btn.id = `key${i}`;
                btn.onclick = () => playForKey(i);

                const num = document.createElement('div');
                num.className = 'key-number';
                num.textContent = i;

                const title = document.createElement('div');
                title.className = 'key-title';
                title.textContent = a ? (a.title || 'Untitled') : 'Empty';

                btn.appendChild(num);
                btn.appendChild(title);
                keysRow2.appendChild(btn);
            }

            // STOP
            const stopButton = document.createElement('div');
            stopButton.className = 'key-button stop-btn';
            stopButton.id = 'stopBtn';
            stopButton.onclick = () => stopPlayback();
            stopButton.style.background = 'var(--error)';
            stopButton.style.color = 'white';

            const stopText = document.createElement('div');
            stopText.className = 'key-number';
            stopText.textContent = 'STOP';
            stopText.style.fontSize = '0.7rem';

            stopButton.appendChild(stopText);
            keysRow2.appendChild(stopButton);
        }

        // Render assignments list
        function renderKeysList() {
            const list = elements.keysList;
            list.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const a = state.assignments.find(x => parseInt(x.key_number) === i);
                const item = document.createElement('div');
                item.className = 'key-item';

                const num = document.createElement('div');
                num.className = 'key-item-number';
                num.textContent = i;

                const content = document.createElement('div');
                content.className = 'key-item-content';

                const title = document.createElement('div');
                title.className = 'key-item-title';
                title.textContent = a ? (a.title || 'Untitled') : 'Empty';

                const desc = document.createElement('div');
                desc.className = 'key-item-description';
                desc.textContent = a ? (a.description || 'No description') : 'No assignment';

                content.appendChild(title);
                content.appendChild(desc);

                item.appendChild(num);
                item.appendChild(content);
                list.appendChild(item);
            }
        }

        // UI message helper
        function showMessage(type, text) {
            const box = elements.statusMessage;
            box.textContent = text;
            box.className = `status-message ${type} show`;
            setTimeout(() => { box.className = `status-message ${type}`; }, 2500);
        }

        // Media URL resolver
        function getMediaUrl(a) {
            return a?.asset?.cloudinary_url ||
                   a?.asset?.file_url ||
                   a?.asset?.media_url ||
                   a?.cloudinary_url   ||
                   a?.file_url         ||
                   a?.database_url     ||
                   null;
        }

        // Inline playback in the modal
        async function playForKey(keyNum) {
            const a = state.assignments.find(x => parseInt(x.key_number) === parseInt(keyNum));
            if (!a) { showMessage('error', `No media assigned to Key ${keyNum}`); return; }
            const url = getMediaUrl(a);
            if (!url) { showMessage('error', 'No media URL found'); return; }

            // Visual state
            document.querySelectorAll('.key-button').forEach(b => b.classList.remove('playing'));
            const curBtn = document.getElementById(`key${keyNum}`);
            if (curBtn) curBtn.classList.add('playing');

            // Render small inline player
            showMediaInModal(a, url);
            state.playing = { key: keyNum, assignmentId: a.id, url, title: a.title || a.asset?.title || 'VoxPro Player' };
            showMessage('success', `Playing: ${state.playing.title}`);
        }

        function showMediaInModal(assignment, url) {
            const modalContent = elements.modalContent;
            const modalTitle   = elements.modalTitle;
            const fileType = (assignment.file_type || assignment.asset?.file_type || '').toLowerCase();

            modalTitle.textContent = assignment.title || 'Media Player';
            modalContent.innerHTML = '';

            let el;
            if (fileType.includes('video') || /\.(mp4|webm|ogg|avi|mov|wmv|flv|mkv)$/i.test(url)) {
                el = document.createElement('video');
                el.controls = true; el.autoplay = true; el.style.width = '100%'; el.src = url;
            } else if (fileType.includes('audio') || /\.(mp3|wav|ogg|aac|flac|m4a)$/i.test(url)) {
                el = document.createElement('audio');
                el.controls = true; el.autoplay = true; el.src = url;
            } else if (fileType.includes('image') || /\.(jpg|jpeg|png|gif|bmp|webp)$/i.test(url)) {
                el = document.createElement('img');
                el.style.maxWidth = '100%'; el.style.borderRadius = '6px'; el.src = url;
            } else {
                el = document.createElement('iframe');
                el.allow = 'autoplay'; el.src = url; el.style.width = '100%'; el.style.height = '200px';
            }
            modalContent.appendChild(el);

            if (assignment.description) {
                const d = document.createElement('div');
                d.className = 'description-overlay';
                d.textContent = assignment.description;
                modalContent.appendChild(d);
            }

            // Reset any prior state
            state.modalState = 'normal';
            elements.modalSection.classList.remove('minimized', 'maximized');
            elements.maximizeBtn.textContent = '□';
            elements.maximizeBtn.title = 'Maximize';
        }

        // Stop playback + reset UI
        function stopPlayback() {
            elements.modalContent.querySelectorAll('audio,video').forEach(m => {
                try { m.pause(); m.removeAttribute('src'); if (m.load) m.load(); } catch (_) {}
            });
            document.querySelectorAll('.key-button').forEach(b => b.classList.remove('playing'));
            state.playing = null;

            elements.modalTitle.textContent = 'VoxPro Player';
            elements.modalContent.innerHTML = `
                <div class="modal-placeholder">
                    <div class="placeholder-icon">🎵</div>
                    <div class="placeholder-text">Press a key to play media</div>
                </div>
            `;
            state.modalState = 'normal';
            elements.modalSection.classList.remove('minimized', 'maximized');
            elements.maximizeBtn.textContent = '□';
            elements.maximizeBtn.title = 'Maximize';
            showMessage('success', 'Playback stopped');
        }

        // Local overlay (fallback if not embedded)
        function openLocalOverlay(url, title) {
            const existing = document.getElementById('voxpro-overlay');
            if (existing) existing.remove();

            const ov = document.createElement('div'); ov.id = 'voxpro-overlay';
            ov.className = 'vp-overlay';

            const win = document.createElement('div'); win.className = 'vp-window';
            const hd  = document.createElement('div'); hd.className  = 'vp-header';
            const tt  = document.createElement('div'); tt.className  = 'vp-title'; tt.textContent = title || 'VoxPro Player';
            const cl  = document.createElement('button'); cl.className = 'vp-close'; cl.textContent = '×';
            const bd  = document.createElement('div'); bd.className  = 'vp-body';

            cl.onclick = () => ov.remove();
            hd.appendChild(tt); hd.appendChild(cl); win.appendChild(hd); win.appendChild(bd);
            ov.appendChild(win); (document.body || document.documentElement).appendChild(ov);

            const a = document.createElement('audio');
            a.controls = true; a.autoplay = true; a.src = url; a.style.maxWidth = '100%';
            bd.appendChild(a);

            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') ov.remove(); }, { once: true });
        }

        // Parent overlay handler (in parent window)
        function createParentWindowHandler() {
            const parentScript = `
            (function(){
              if (window.__voxproParent) return; window.__voxproParent = true;

              function removeOverlay(){
                const ex = document.getElementById('voxpro-overlay');
                if (ex) ex.remove();
              }
              function openOverlay(url, title){
                removeOverlay();
                const ov = document.createElement('div');
                ov.id='voxpro-overlay';
                ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2147483647;display:flex;align-items:center;justify-content:center';
                const win=document.createElement('div');
                win.style.cssText='width:90vw;height:90vh;max-width:1200px;max-height:800px;background:#1a2332;border-radius:8px;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.5)';
                const hd=document.createElement('div');
                hd.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0b1220;border-radius:8px 8px 0 0;border-bottom:1px solid #2a3441';
                const tt=document.createElement('div'); tt.textContent=title||'VoxPro Player'; tt.style.cssText='color:#fff;font-weight:600';
                const cl=document.createElement('button'); cl.textContent='×'; cl.style.cssText='background:#667eea;color:#fff;border:0;border-radius:4px;width:32px;height:32px;cursor:pointer;font-size:18px;font-weight:700';
                const bd=document.createElement('div'); bd.style.cssText='flex:1;padding:20px;display:flex;align-items:center;justify-content:center;overflow:auto';
                cl.onclick=function(){ removeOverlay(); };
                hd.appendChild(tt); hd.appendChild(cl); win.appendChild(hd); win.appendChild(bd); ov.appendChild(win); (document.body||document.documentElement).appendChild(ov);
                const a=document.createElement('audio'); a.controls=true; a.autoplay=true; a.src=url; a.style.maxWidth='100%'; bd.appendChild(a);
                document.addEventListener('keydown', function(e){ if(e.key==='Escape') removeOverlay(); }, {once:true});
              }

              window.addEventListener('message', function(ev){
                var d = ev && ev.data; if(!d) return;
                if (d.type==='VOXPRO_OPEN' && d.payload) { openOverlay(d.payload.url, d.payload.title); }
                if (d.type==='VOXPRO_CLOSE') { removeOverlay(); }
              });
            })();`;

            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'VOXPRO_PARENT_INSTALL', script: parentScript }, '*');
            }

            // Local fallback listener (not usually hit)
            window.addEventListener('message', (e) => {
                if (!e.data) return;
                if (e.data.type === 'VOXPRO_OPEN_LOCAL' && e.data.payload) {
                    openLocalOverlay(e.data.payload.url, e.data.payload.title);
                }
            });
        }

        // Controls & maximize behaviour
        function attachEventListeners() {
            elements.minimizeBtn.addEventListener('click', () => {
                elements.modalSection.style.height = '60px';
                elements.modalContent.style.display = 'none';
                elements.minimizeBtn.style.display = 'none';
                elements.maximizeBtn.textContent = '□';
                state.modalState = 'minimized';
            });

            elements.closeBtn.addEventListener('click', stopPlayback);

            // MAXIMIZE — pause local media, then open a single overlay in parent/local
            elements.maximizeBtn.addEventListener('click', () => {
                if (state.modalState === 'breakout') {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'VOXPRO_CLOSE' }, '*');
                    } else {
                        const ex = document.getElementById('voxpro-overlay');
                        if (ex) ex.remove();
                    }
                    state.modalState = 'normal';
                    elements.maximizeBtn.textContent = '□';
                    return;
                }

                if (!state.playing || !state.playing.url) {
                    showMessage('warning', 'Nothing is playing to maximize.');
                    return;
                }

                // Prevent double audio under overlay
                elements.modalContent.querySelectorAll('audio,video').forEach(m => {
                    try { m.pause(); m.removeAttribute('src'); if (m.load) m.load(); } catch (_) {}
                });

                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'VOXPRO_OPEN',
                        payload: { url: state.playing.url, title: state.playing.title || 'VoxPro Player' }
                    }, '*');
                } else {
                    openLocalOverlay(state.playing.url, state.playing.title || 'VoxPro Player');
                }

                state.modalState = 'breakout';
                elements.maximizeBtn.textContent = '❐';
            });

            // STOP (rendered in second row)
            const stopBtn = document.getElementById('stopBtn');
            if (stopBtn) stopBtn.onclick = stopPlayback;

            // Key buttons click binding after render
            for (let i = 1; i <= 5; i++) {
                const b = document.getElementById(`key${i}`);
                if (b) b.onclick = () => playForKey(i);
            }
        }

        // Parent bootstrap: allow the iframe to install handler
        window.addEventListener('message', (ev) => {
            if (!ev || !ev.data) return;
            if (ev.data.type === 'VOXPRO_PARENT_INSTALL' && ev.data.script && (window.parent === window)) {
                try {
                    const s = document.createElement('script');
                    s.textContent = ev.data.script;
                    document.head.appendChild(s);
                } catch (e) { console.error('Parent install exec error', e); }
            }
        });

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initCompanionPlayer);
    </script>
</body>
</html>

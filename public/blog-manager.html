<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Manager</title>
  <!-- Minimal styling inspired by the VoxPro file manager -->
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      /* Gradient similar to the file manager */
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 960px;
      margin: 2rem auto;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      padding: 1.5rem;
      border-radius: 12px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-bottom: 0.25rem;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.4);
    }
    .button {
      display: inline-block;
      padding: 0.6rem 1.2rem;
      margin-right: 0.5rem;
      margin-top: 0.5rem;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .button.primary {
      background: #667eea;
      color: white;
    }
    .button.primary:hover {
      background: #5567d4;
    }
    .button.secondary {
      background: #f093fb;
      color: white;
    }
    .button.secondary:hover {
      background: #e387f0;
    }
    .row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .row > div {
      flex: 1 1 48%;
    }
    .file-drop {
      border: 2px dashed #ccc;
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      margin-bottom: 1rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
    }
    #preview {
      background: rgba(0, 0, 0, 0.2);
      padding: 1rem;
      border-radius: 6px;
      margin-top: 1rem;
      display: none;
    }
  </style>
  <!-- Quill rich‑text editor -->
  <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.6/quill.snow.css">
</head>
<body>
  <div class="container">
    <h1>Blog Manager</h1>
    <form id="blogForm">
      <div>
        <label for="title">Title</label>
        <input type="text" id="title" required>
      </div>
      <div>
        <label for="slug">Slug (optional)</label>
        <input type="text" id="slug">
      </div>
      <div>
        <label for="author">Author</label>
        <input type="text" id="author" required>
      </div>
      <div>
        <label for="status">Status</label>
        <select id="status">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
          <option value="scheduled">Scheduled</option>
        </select>
      </div>
      <div id="scheduleContainer" style="display:none;">
        <label for="scheduleAt">Publish At (local date/time)</label>
        <input type="datetime-local" id="scheduleAt">
      </div>
      <div>
        <label for="tags">Tags (comma separated)</label>
        <input type="text" id="tags" placeholder="e.g. news,history">
      </div>
      <div>
        <label for="summary">Summary</label>
        <textarea id="summary" rows="3"></textarea>
      </div>
      <div class="row">
        <div>
          <label for="heroUrl">Hero Image URL</label>
          <input type="text" id="heroUrl">
        </div>
        <div>
          <label for="heroAlt">Hero Image Alt</label>
          <input type="text" id="heroAlt">
        </div>
      </div>
      <div class="file-drop" id="fileDrop">Drag and drop hero image here or click to select</div>
      <input type="file" id="fileInput" style="display:none;">
      <div>
        <label>Body</label>
        <!-- Quill editor container -->
        <div id="editor" style="height: 300px; background: white; color: black;"></div>
      </div>
      <input type="hidden" id="bodyFormat" value="html">
      <input type="hidden" id="postId">
      <button type="button" class="button primary" id="saveBtn">Save</button>
      <button type="button" class="button secondary" id="previewBtn">Preview</button>
    </form>
    <div id="preview"></div>
  </div>

  <!-- External libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script>
    // Initialize Quill editor
    const quill = new Quill('#editor', {
      theme: 'snow'
    });

    // Show/hide schedule field based on status
    document.getElementById('status').addEventListener('change', e => {
      const container = document.getElementById('scheduleContainer');
      container.style.display = e.target.value === 'scheduled' ? 'block' : 'none';
    });

    // Toggle file input when clicking drop area
    const fileDrop = document.getElementById('fileDrop');
    const fileInput = document.getElementById('fileInput');
    fileDrop.addEventListener('click', () => fileInput.click());
    fileDrop.addEventListener('dragover', (e) => {
      e.preventDefault();
      fileDrop.style.borderColor = '#667eea';
    });
    fileDrop.addEventListener('dragleave', () => fileDrop.style.borderColor = '#ccc');
    fileDrop.addEventListener('drop', (e) => {
      e.preventDefault();
      fileInput.files = e.dataTransfer.files;
      fileDrop.style.borderColor = '#ccc';
    });

    // Helper: slugify title
    function slugify(text) {
      return text.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    // Auto-generate slug from title if slug is blank or auto-generated
    const titleInput = document.getElementById('title');
    const slugInput = document.getElementById('slug');
    titleInput.addEventListener('input', () => {
      if (!slugInput.value || slugInput.dataset.auto === 'true') {
        slugInput.value = slugify(titleInput.value);
        slugInput.dataset.auto = 'true';
      }
    });
    slugInput.addEventListener('input', () => {
      if (slugInput.value !== slugify(titleInput.value)) {
        slugInput.dataset.auto = 'false';
      }
    });

    // Collect form data
    function collectData() {
      return {
        id: document.getElementById('postId').value || undefined,
        title: document.getElementById('title').value.trim(),
        slug: document.getElementById('slug').value.trim() || undefined,
        author: document.getElementById('author').value.trim(),
        status: document.getElementById('status').value,
        scheduleAt: document.getElementById('scheduleAt').value,
        tags: document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean),
        summary: document.getElementById('summary').value.trim(),
        heroUrl: document.getElementById('heroUrl').value.trim(),
        heroAlt: document.getElementById('heroAlt').value.trim(),
        body: quill.root.innerHTML,
        bodyFormat: document.getElementById('bodyFormat').value
      };
    }

    // Preview button handler
    document.getElementById('previewBtn').addEventListener('click', () => {
      const data = collectData();
      const previewEl = document.getElementById('preview');
      previewEl.style.display = 'block';
      // If bodyFormat is HTML, show as-is; else convert markdown using marked
      previewEl.innerHTML = data.body;
    });

    // Save button handler
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const payload = collectData();
      try {
        // Always POST to posts-create function; update vs create is handled server-side
        const res = await fetch('/.netlify/functions/posts-create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch (err) {
          alert('Server returned invalid JSON. Response preview: ' + text.slice(0, 100));
          return;
        }
        if (!res.ok) {
          alert(json.error || 'Error saving post');
          return;
        }
        alert('Post saved successfully');
        // If scheduled, call schedule endpoint
        if (payload.status === 'scheduled' && payload.scheduleAt) {
          const schedRes = await fetch('/.netlify/functions/posts-create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: json.id || json._id, scheduleAt: payload.scheduleAt })
          });
          const schedText = await schedRes.text();
          try {
            JSON.parse(schedText);
          } catch (e) {
            console.warn('Schedule response not JSON:', schedText);
          }
        }
        // Clear form
        document.getElementById('blogForm').reset();
        quill.setContents([]);
      } catch (e) {
        alert('Error saving post: ' + e.message);
      }
    });
  </script>
</body>
</html>

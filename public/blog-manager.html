<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Manager</title>

  <!-- Load Tailwind and Quill from local /public/vendor directory -->
  <link rel="stylesheet" href="/public/vendor/tailwind.min.css">
  <link rel="stylesheet" href="/public/vendor/quill.snow.css">

  <!-- Load Marked and Quill JS from local /public/vendor directory -->
  <script src="/public/vendor/marked.min.js"></script>
  <script src="/public/vendor/quill.min.js"></script>

  <!-- Custom styles for dark mode inputs and editor -->
  <style>
    /* Base page dark background and text color */
    body {
      background-color: #0a192f; /* dark navy */
      color: #f8fafc; /* near white */
    }
    /* Dark mode form elements */
    .dark input,
    .dark select,
    .dark textarea {
      background-color: #1e293b; /* dark slate */
      color: #e2e8f0;            /* light gray */
      border-color: #475569;     /* slate border */
    }
    .dark input::placeholder,
    .dark textarea::placeholder,
    .dark select option {
      color: #94a3b8;           /* slate placeholder */
    }
    /* Dark mode Quill containers */
    .dark .ql-toolbar,
    .dark .ql-container {
      background-color: #1e293b;
      border-color: #334155;
    }
    .dark .ql-editor {
      color: #e2e8f0;
    }
    .dark .ql-toolbar button svg {
      stroke: #f3f4f6;
      fill: #f3f4f6;
    }
    .dark .ql-toolbar button:hover svg {
      stroke: #ffffff;
      fill: #ffffff;
    }
    .dark .ql-toolbar .ql-picker,
    .dark .ql-picker-label,
    .dark .ql-picker-item {
      color: #cbd5e1 !important; /* slate-300 */
    }
    .dark .ql-picker-options {
      background-color: #1e293b !important;
    }
  </style>
</head>
<body class="p-6">
  <div class="max-w-3xl mx-auto">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-3xl font-bold">Blog Manager</h1>
      <button id="themeToggle"
              class="px-3 py-1 rounded border border-gray-600 text-sm">
        Toggle Theme
      </button>
    </div>
    <form id="blogForm"
          class="space-y-4 p-6 bg-gray-800 text-gray-100 rounded shadow border border-gray-700">
      <div>
        <label class="block font-medium text-gray-300">Title</label>
        <input id="title" type="text"
               class="w-full bg-gray-700 border border-gray-600 p-2 rounded text-gray-100 placeholder-gray-500"
               required>
      </div>
      <div>
        <label class="block font-medium text-gray-300">Slug (optional)</label>
        <input id="slug" type="text"
               class="w-full bg-gray-700 border border-gray-600 p-2 rounded text-gray-100 placeholder-gray-500">
      </div>
      <div>
        <label class="block font-medium text-gray-300">Author</label>
        <input id="author" list="authors" type="text"
               class="w-full bg-gray-700 border border-gray-600 p-2 rounded text-gray-100 placeholder-gray-500"
               required>
        <datalist id="authors"></datalist>
      </div>
      <div>
        <label class="block font-medium text-gray-300">Status</label>
        <select id="status"
                class="w-full bg-gray-700 border border-gray-600 p-2 rounded text-gray-100">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
          <option value="scheduled">Scheduled</option>
        </select>
      </div>
      <div id="scheduleField" class="hidden">
        <label class="block font-medium text-gray-300">Publish At (ISO date/time)</label>
        <input id="scheduleAt" type="datetime-local"
               class="w-full bg-gray-700 border border-gray-600 p-2 rounded text-gray-100">
      </div>
      <div>
        <label class="block font-medium text-gray-300">Tags (comma separated)</label>
        <input id="tags" type="text" list="tagsList"
               class="w-full bg-gray-700 border border-gray-600 p-2 rounded text-gray-100 placeholder-gray-500">
        <datalist id="tagsList"></datalist>
      </div>
      <div>
        <label class="block font-medium text-gray-300">Summary</label>
        <textarea id="summary"
                  class="w-full bg-gray-700 border border-gray-600 p-2 rounded text-gray-100 placeholder-gray-500"
                  rows="3"></textarea>
      </div>
      <div>
        <label class="block font-medium text-gray-300">Hero Image URL</label>
        <input id="heroUrl" type="text"
               class="w-full bg-gray-700 border border-gray-600 p-2 rounded text-gray-100 placeholder-gray-500">
      </div>
      <div>
        <label class="block font-medium text-gray-300">Hero Image Alt</label>
        <input id="heroAlt" type="text"
               class="w-full bg-gray-700 border border-gray-600 p-2 rounded text-gray-100 placeholder-gray-500">
      </div>
      <!-- Hero image upload -->
      <div>
        <label class="block font-medium text-gray-300">Upload Hero Image</label>
        <div id="heroDropZone"
             class="mt-1 border-2 border-dashed border-gray-500 p-4 rounded text-center cursor-pointer text-gray-100 bg-gray-700">
          <span>Drag and drop hero image here or click to select</span>
          <input type="file" id="heroInput" accept="image/*" class="hidden">
        </div>
        <div id="heroPreview" class="mt-2 text-sm"></div>
      </div>
      <input type="hidden" id="bodyFormat" value="html">
      <div>
        <label class="block font-medium text-gray-300">Body</label>
        <div id="editor" class="w-full border border-gray-600 p-2 rounded h-64 bg-gray-700"></div>
        <textarea id="body" class="w-full border border-gray-600 p-2 rounded h-64 bg-gray-700 text-gray-100" hidden></textarea>
      </div>
      <div class="flex items-center space-x-2">
        <button type="button" id="saveBtn"
                class="bg-blue-600 text-white px-4 py-2 rounded">Save</button>
        <button type="button" id="updateBtn"
                class="bg-green-600 text-white px-4 py-2 rounded"
                disabled>Update</button>
        <button type="button" id="previewBtn"
                class="bg-purple-600 text-white px-4 py-2 rounded">Preview</button>
      </div>
      <input type="hidden" id="postId">
    </form>

    <section id="settingsSection"
             class="mt-10 p-4 bg-gray-800 text-gray-100 rounded shadow border border-gray-700">
      <h2 class="text-xl font-bold mb-2">Comments Settings</h2>
      <label class="flex items-center space-x-2 text-gray-300">
        <input type="checkbox" id="requireApproval">
        <span>Require approval for new comments</span>
      </label>
      <div id="settingsStatus" class="text-sm text-gray-400 mt-2"></div>
    </section>

    <section id="moderationSection"
             class="mt-10 p-4 bg-gray-800 text-gray-100 rounded shadow border border-gray-700">
      <h2 class="text-xl font-bold mb-2">Comments Moderation</h2>
      <div class="flex flex-wrap gap-2 mb-4 items-center">
        <label class="font-medium text-gray-300">State:</label>
        <select id="commentState"
                class="border border-gray-600 p-2 rounded bg-gray-700 text-gray-100">
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
          <option value="all">All</option>
        </select>
        <label class="font-medium text-gray-300">Post ID:</label>
        <input id="filterPostId"
               type="text"
               class="border border-gray-600 p-2 rounded bg-gray-700 text-gray-100 placeholder-gray-500"
               placeholder="Optional">
        <input id="commentSearch"
               type="text"
               class="border border-gray-600 p-2 rounded bg-gray-700 text-gray-100 placeholder-gray-500 flex-grow"
               placeholder="Search comments...">
        <button type="button" id="refreshComments"
                class="bg-gray-600 text-gray-100 px-3 py-2 rounded">Refresh</button>
      </div>
      <div id="commentsList" class="space-y-2"></div>
    </section>

    <div id="previewOverlay"
         class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
      <div class="bg-gray-800 text-gray-100 rounded-lg shadow-lg max-w-2xl w-full max-h-[90vh] overflow-auto p-6 relative border border-gray-700">
        <button id="closePreview"
                class="absolute top-2 right-2 text-gray-400 hover:text-gray-200">✕</button>
        <div id="previewContent" class="space-y-4"></div>
      </div>
    </div>
  </div>
  <script>
    // Configuration for Netlify functions
    const CFG = {
      fns: {
        create: '/.netlify/functions/posts-create',
        update: '/.netlify/functions/posts-create',
        schedule: '/.netlify/functions/posts-create',
        listComments: '/.netlify/functions/comments-list',
        moderateComment: '/.netlify/functions/comments-moderate',
        getSettings: '/.netlify/functions/comments-settings-get',
        setSettings: '/.netlify/functions/comments-settings-set',
        upload: '/.netlify/functions/file-manager-upload'
      },
      cloudinary: {
        uploadUrl: 'https://api.cloudinary.com/v1_1/dzrw8nopf/auto/upload',
        uploadPreset: 'blogHeroUnsigned'
      }
    };

    // Global storage for comments (attachments removed)
    let commentsData = [];

    // Quill instance for rich text editing
    let quill;

    // Utility: slugify a string to make a URL-friendly slug
    function slugify(str) {
      return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    // Tags suggestions handling
    function loadTags() {
      const tagsHist = JSON.parse(localStorage.getItem('tags') || '[]');
      const list = document.getElementById('tagsList');
      if (!list) return;
      list.innerHTML = '';
      tagsHist.forEach(tag => {
        const option = document.createElement('option');
        option.value = tag;
        list.appendChild(option);
      });
    }
    function saveTags(tags) {
      let tagsHist = JSON.parse(localStorage.getItem('tags') || '[]');
      tags.forEach(tag => {
        if (tag && !tagsHist.includes(tag)) tagsHist.push(tag);
      });
      localStorage.setItem('tags', JSON.stringify(tagsHist));
    }
    loadTags();

    // Autosave draft to localStorage
    function saveDraft() {
      const id = document.getElementById('postId').value;
      if (id) return;
      const data = collectForm();
      localStorage.setItem('blogDraft', JSON.stringify(data));
    }
    function loadDraft() {
      const id = document.getElementById('postId').value;
      if (id) return;
      const saved = localStorage.getItem('blogDraft');
      if (!saved) return;
      try {
        const data = JSON.parse(saved);
        document.getElementById('title').value = data.title || '';
        document.getElementById('slug').value = data.slug || '';
        document.getElementById('author').value = data.author || '';
        document.getElementById('status').value = data.status || 'draft';
        if (data.status === 'scheduled' && data.scheduleAt) {
          const dt = new Date(data.scheduleAt);
          const iso = dt.toISOString().slice(0, 16);
          document.getElementById('scheduleAt').value = iso;
          document.getElementById('scheduleField').classList.remove('hidden');
        }
        document.getElementById('tags').value = (data.tags || []).join(', ');
        document.getElementById('summary').value = data.summary || '';
        document.getElementById('heroUrl').value = data.heroUrl || '';
        document.getElementById('heroAlt').value = data.heroAlt || '';
        document.getElementById('bodyFormat').value = data.bodyFormat || 'html';
        const format = document.getElementById('bodyFormat').value;
        if (format === 'html') {
          if (quill) {
            quill.root.innerHTML = data.body || '';
          }
        } else {
          document.getElementById('body').value = data.body || '';
        }
        updatePreview();
      } catch (e) {
        console.error('Failed to load draft', e);
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      initQuill();
      const textarea = document.getElementById('body');
      if (textarea) textarea.hidden = true;
      loadDraft();
    });

    document.getElementById('blogForm').addEventListener('input', saveDraft);
    document.getElementById('blogForm').addEventListener('change', saveDraft);

    const titleInput = document.getElementById('title');
    const slugInput = document.getElementById('slug');
    titleInput.addEventListener('input', function() {
      if (!slugInput.value || slugInput.dataset.auto === 'true') {
        slugInput.value = slugify(this.value);
        slugInput.dataset.auto = 'true';
      }
    });
    slugInput.addEventListener('input', function() {
      if (this.value !== slugify(titleInput.value)) {
        this.dataset.auto = 'false';
      }
    });

    slugInput.addEventListener('blur', function() {
      if (!this.value) {
        this.value = slugify(titleInput.value);
        this.dataset.auto = 'true';
      }
    });

    document.getElementById('blogForm').addEventListener('input', updatePreview);

    function loadAuthors() {
      const authors = JSON.parse(localStorage.getItem('authors') || '[]');
      const list = document.getElementById('authors');
      list.innerHTML = '';
      authors.forEach(a => {
        const option = document.createElement('option');
        option.value = a;
        list.appendChild(option);
      });
    }
    loadAuthors();

    function saveAuthor(author) {
      const authors = JSON.parse(localStorage.getItem('authors') || '[]');
      if (!authors.includes(author)) {
        authors.push(author);
        localStorage.setItem('authors', JSON.stringify(authors));
      }
    }

    document.getElementById('status').addEventListener('change', function() {
      document.getElementById('scheduleField').classList.toggle('hidden', this.value !== 'scheduled');
    });

    document.getElementById('saveBtn').addEventListener('click', async function() {
      const id = document.getElementById('postId').value;
      (function ensureSlug() {
        const slugField = document.getElementById('slug');
        const titleVal = document.getElementById('title').value.trim();
        if (slugField && !slugField.value.trim() && titleVal) {
          slugField.value = slugify(titleVal);
          slugField.dataset.auto = 'true';
        }
      })();
      const payload = collectForm();
      try {
        const url = id ? CFG.fns.update : CFG.fns.create;
        const method = 'POST';
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(id ? { id, ...payload } : payload)
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch (parseErr) {
          throw new Error('Server returned invalid JSON for save. Response preview: ' + text.slice(0, 100));
        }
        if (!res.ok) throw new Error(json.error || 'Unknown error');
        saveAuthor(payload.author);
        saveTags(payload.tags);
        if (payload.status === 'scheduled' && payload.scheduleAt) {
          const scheduleRes = await fetch(CFG.fns.schedule, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: (json.id || json._id || json.itemId || json.item_id), scheduleAt: payload.scheduleAt })
          });
          const schedText = await scheduleRes.text();
          let schedJson;
          try {
            schedJson = JSON.parse(schedText);
          } catch (schedParseErr) {
            throw new Error('Schedule function returned invalid JSON. Response preview: ' + schedText.slice(0, 100));
          }
          if (!scheduleRes.ok) throw new Error(schedJson.error || 'Schedule error');
        }
        alert('Post saved successfully!');
        loadTags();
        if (!id) {
          document.getElementById('postId').value = json.id || json._id || json.itemId || json.item_id || '';
          document.getElementById('updateBtn').disabled = false;
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });

    document.getElementById('updateBtn').addEventListener('click', function() {
      document.getElementById('saveBtn').click();
    });

    function collectForm() {
      const status = document.getElementById('status').value;
      const scheduleAt = document.getElementById('scheduleAt').value;
      return {
        title: document.getElementById('title').value.trim(),
        slug: document.getElementById('slug').value.trim() || undefined,
        author: document.getElementById('author').value.trim(),
        status: status,
        scheduleAt: status === 'scheduled' && scheduleAt ? new Date(scheduleAt).toISOString() : undefined,
        tags: document.getElementById('tags').value.split(',').map(t => t.trim()).filter(t => t),
        summary: document.getElementById('summary').value,
        heroUrl: document.getElementById('heroUrl').value.trim() || undefined,
        heroAlt: document.getElementById('heroAlt').value.trim() || undefined,
        bodyFormat: document.getElementById('bodyFormat').value,
        body: (function() {
          const fmt = document.getElementById('bodyFormat').value;
          if (fmt === 'html') {
            return quill ? quill.root.innerHTML : document.getElementById('body').value;
          }
          return document.getElementById('body').value;
        })()
      };
    }

    async function loadSettings() {
      try {
        const res = await fetch(CFG.fns.getSettings);
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch (parseErr) {
          throw new Error('Server returned invalid JSON for settings. Response preview: ' + text.slice(0, 100));
        }
        if (res.ok) {
          document.getElementById('requireApproval').checked = !!json.requireApproval;
          document.getElementById('settingsStatus').textContent = '';
        } else {
          document.getElementById('settingsStatus').textContent = 'Error loading settings: ' + (json.error || res.status);
        }
      } catch (err) {
        document.getElementById('settingsStatus').textContent = 'Error loading settings: ' + err.message;
      }
    }
    loadSettings();
    document.getElementById('requireApproval').addEventListener('change', async function() {
      try {
        const res = await fetch(CFG.fns.setSettings, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ requireApproval: this.checked })
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch (parseErr) {
          throw new Error('Server returned invalid JSON when saving settings. Response preview: ' + text.slice(0, 100));
        }
        if (!res.ok) throw new Error(json.error || 'Unknown error');
        document.getElementById('settingsStatus').textContent = 'Settings saved';
      } catch (err) {
        document.getElementById('settingsStatus').textContent = 'Error saving settings: ' + err.message;
      }
    });

    async function loadComments() {
      const state = document.getElementById('commentState').value;
      const postId = document.getElementById('filterPostId').value.trim();
      const params = new URLSearchParams();
      if (state) params.set('state', state);
      if (postId) params.set('postId', postId);
      try {
        const res = await fetch(CFG.fns.listComments + '?' + params.toString());
        const text = await res.text();
        let list;
        try {
          list = JSON.parse(text);
        } catch (parseErr) {
          throw new Error('Server returned invalid JSON when loading comments. Response preview: ' + text.slice(0, 100));
        }
        commentsData = Array.isArray(list) ? list : [];
        filterComments();
      } catch (err) {
        document.getElementById('commentsList').innerHTML = '<div class="text-red-600">' + err.message + '</div>';
      }
    }
    document.getElementById('refreshComments').addEventListener('click', loadComments);
    document.getElementById('commentState').addEventListener('change', loadComments);

    function renderComments(list) {
      const container = document.getElementById('commentsList');
      container.innerHTML = '';
      if (!Array.isArray(list) || list.length === 0) {
        container.textContent = 'No comments found.';
        return;
      }
      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'p-3 border rounded bg-gray-700 text-gray-100 border-gray-600';
        const meta = document.createElement('div');
        meta.className = 'text-sm text-gray-400 mb-1';
        meta.textContent = 'ID: ' + item.id + ' • Post: ' + (item.postId || item.slug || '') + ' • ' + new Date(item.createdAt || item.created_at || Date.now()).toLocaleString();
        const author = document.createElement('div');
        author.className = 'font-semibold';
        author.textContent = item.author;
        const body = document.createElement('div');
        body.className = 'my-1';
        body.textContent = item.body;
        card.appendChild(meta);
        card.appendChild(author);
        card.appendChild(body);
        if (item.state === 'pending') {
          const actions = document.createElement('div');
          actions.className = 'flex space-x-2';
          const approveBtn = document.createElement('button');
          approveBtn.className = 'px-3 py-1 bg-green-600 text-white rounded';
          approveBtn.textContent = 'Approve';
          approveBtn.addEventListener('click', () => moderateComment(item.id, 'approve'));
          const rejectBtn = document.createElement('button');
          rejectBtn.className = 'px-3 py-1 bg-red-600 text-white rounded';
          rejectBtn.textContent = 'Reject';
          rejectBtn.addEventListener('click', () => moderateComment(item.id, 'reject'));
          actions.appendChild(approveBtn);
          actions.appendChild(rejectBtn);
          card.appendChild(actions);
        } else {
          const stateLabel = document.createElement('div');
          stateLabel.className = 'italic text-gray-400';
          stateLabel.textContent = 'State: ' + item.state;
          card.appendChild(stateLabel);
        }
        container.appendChild(card);
      });
    }

    async function moderateComment(id, action) {
      try {
        const res = await fetch(CFG.fns.moderateComment, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, action })
        });
        const text = await res.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch (parseErr) {
          throw new Error('Server returned invalid JSON when moderating comment. Response preview: ' + text.slice(0, 100));
        }
        if (!res.ok) throw new Error(json.error || 'Unknown error');
        loadComments();
      } catch (err) {
        alert('Error moderating comment: ' + err.message);
      }
    }

    loadComments();

    function filterComments() {
      const query = (document.getElementById('commentSearch')?.value || '').trim().toLowerCase();
      if (!query) {
        renderComments(commentsData);
        return;
      }
      const filtered = commentsData.filter(item => {
        const author = (item.author || '').toLowerCase();
        const body = (item.body || '').toLowerCase();
        return author.includes(query) || body.includes(query);
      });
      renderComments(filtered);
    }
    const searchInput = document.getElementById('commentSearch');
    if (searchInput) {
      searchInput.addEventListener('input', filterComments);
    }

    function updatePreview() {
      const data = collectForm();
      let html = '';
      if (data.heroUrl) {
        const alt = data.heroAlt || '';
        html += `<img class="w-full mb-4 rounded" src="${data.heroUrl}" alt="${alt}">`;
      }
      html += `<h1 class="text-3xl font-bold mb-2">${data.title || ''}</h1>`;
      const metaParts = [];
      if (data.author) metaParts.push(`By ${data.author}`);
      if (Array.isArray(data.tags) && data.tags.length) metaParts.push(data.tags.join(', '));
      if (metaParts.length) {
        html += `<p class="text-sm text-gray-400 mb-2">${metaParts.join(' • ')}</p>`;
      }
      if (data.summary) {
        html += `<p class="mb-4">${data.summary}</p>`;
      }
      let bodyHtml = data.body || '';
      if (data.bodyFormat === 'markdown') {
        try {
          bodyHtml = marked.parse(bodyHtml);
        } catch (e) {}
      } else if (data.bodyFormat === 'html') {
        bodyHtml = quill ? quill.root.innerHTML : bodyHtml;
      }
      html += `<div class="prose dark:prose-invert">${bodyHtml}</div>`;
      document.getElementById('previewContent').innerHTML = html;
    }

    const overlay = document.getElementById('previewOverlay');
    document.getElementById('previewBtn').addEventListener('click', () => {
      updatePreview();
      overlay.classList.remove('hidden');
    });
    document.getElementById('closePreview').addEventListener('click', () => {
      overlay.classList.add('hidden');
    });
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.add('hidden');
    });

    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      const htmlEl = document.documentElement;
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        htmlEl.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    });
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();

    const heroDropZone = document.getElementById('heroDropZone');
    const heroInput = document.getElementById('heroInput');
    function clearHeroPreview() {
      const preview = document.getElementById('heroPreview');
      if (preview) preview.innerHTML = '';
    }
    async function uploadHeroFile(file) {
      const MAX_MB = 50;
      const maxBytes = MAX_MB * 1024 * 1024;

      if (file.size > maxBytes) {
        alert('The selected file is larger than 50MB. Please choose a smaller file or compress it before uploading.');
        return;
      }

      if (CFG.cloudinary && CFG.cloudinary.uploadUrl && CFG.cloudinary.uploadPreset) {
        let fileForUpload = file;
        const TEN_MB = 10 * 1024 * 1024;
        if (file.size > TEN_MB) {
          try {
            fileForUpload = await compressImage(file);
          } catch (compErr) {
            console.warn('Compression failed, uploading original file to Cloudinary:', compErr);
            fileForUpload = file;
          }
        }
        try {
          const cForm = new FormData();
          cForm.append('file', fileForUpload);
          cForm.append('upload_preset', CFG.cloudinary.uploadPreset);
          const cResp = await fetch(CFG.cloudinary.uploadUrl, { method: 'POST', body: cForm });
          const cText = await cResp.text();
          let cJson;
          try {
            cJson = JSON.parse(cText);
          } catch (err) {
            throw new Error('Cloudinary returned invalid JSON. Response preview: ' + cText.slice(0, 100));
          }
          if (!cResp.ok) {
            throw new Error(cJson.error && cJson.error.message ? cJson.error.message : 'Cloudinary upload error');
          }
          const cUrl = cJson.secure_url || cJson.url;
          if (cUrl) {
            document.getElementById('heroUrl').value = cUrl;
            updateHeroPreview(cUrl, fileForUpload.name);
            updatePreview();
          }
          return;
        } catch (cloudErr) {
          alert('Direct upload to Cloudinary failed: ' + cloudErr.message + '. Please choose a smaller file or try again later.');
          return;
        }
      }

      const NETLIFY_LIMIT = 10 * 1024 * 1024;
      if (file.size > NETLIFY_LIMIT) {
        alert('The selected file is larger than the server upload limit (~10MB) and no Cloudinary configuration is available. Please choose a smaller file.');
        return;
      }
      try {
        const formData = new FormData();
        formData.append('attachment', file);
        const res = await fetch(CFG.fns.upload, {
          method: 'POST',
          body: formData
        });
        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch (parseErr) {
          throw new Error('Server returned invalid JSON. Please ensure your upload function returns a JSON object. Response preview: ' + text.slice(0, 100));
        }
        if (!res.ok) throw new Error(data.error || 'Upload error');
        const url = data.url || data.secure_url || '';
        if (url) {
          document.getElementById('heroUrl').value = url;
          updateHeroPreview(url, file.name);
          updatePreview();
        }
      } catch (err) {
        console.error('Hero upload failed:', err);
        try {
          const dataUrl = await fileToDataURL(file);
          document.getElementById('heroUrl').value = dataUrl;
          updateHeroPreview(dataUrl, file.name);
          updatePreview();
          alert('Upload failed; using local image. Please check your upload function. ' + err.message);
        } catch (readErr) {
          alert('Error uploading hero image: ' + err.message);
        }
      }
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function compressImage(file, targetMB = 10) {
      if (!file.type.startsWith('image/')) return file;
      const maxBytes = targetMB * 1024 * 1024;
      const dataUrl = await fileToDataURL(file);
      const img = await loadImage(dataUrl);
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      let quality = 0.8;
      let blob;
      do {
        blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
        if (blob.size > maxBytes && quality > 0.4) {
          quality -= 0.1;
        } else {
          break;
        }
      } while (true);
      const newName = file.name.replace(/\.[^.]+$/, '.jpg');
      return new File([blob], newName, { type: 'image/jpeg' });
    }

    function updateHeroPreview(url, name) {
      clearHeroPreview();
      const preview = document.getElementById('heroPreview');
      if (!preview) return;
      const wrapper = document.createElement('div');
      wrapper.className = 'flex items-center space-x-3 p-2 border rounded mb-2 bg-gray-700 text-gray-100 border-gray-600';
      const img = document.createElement('img');
      img.src = url;
      img.className = 'h-12 w-12 object-cover rounded';
      const nameEl = document.createElement('span');
      nameEl.className = 'flex-1 truncate';
      nameEl.textContent = name || url;
      const removeBtn = document.createElement('button');
      removeBtn.textContent = '✕';
      removeBtn.className = 'px-2 py-1 border border-gray-600 rounded text-red-500';
      removeBtn.addEventListener('click', () => {
        document.getElementById('heroUrl').value = '';
        clearHeroPreview();
        updatePreview();
      });
      wrapper.appendChild(img);
      wrapper.appendChild(nameEl);
      wrapper.appendChild(removeBtn);
      preview.appendChild(wrapper);
    }
    function handleHeroFiles(files) {
      const file = files && files[0];
      if (!file) return;
      updateHeroPreview(URL.createObjectURL(file), file.name);
      uploadHeroFile(file);
    }
    if (heroDropZone) {
      heroDropZone.addEventListener('click', () => heroInput && heroInput.click());
      heroDropZone.addEventListener('dragover', e => {
        e.preventDefault();
        heroDropZone.classList.add('bg-gray-600');
      });
      heroDropZone.addEventListener('dragleave', e => {
        e.preventDefault();
        heroDropZone.classList.remove('bg-gray-600');
      });
      heroDropZone.addEventListener('drop', e => {
        e.preventDefault();
        heroDropZone.classList.remove('bg-gray-600');
        handleHeroFiles(e.dataTransfer.files);
      });
    }
    if (heroInput) {
      heroInput.addEventListener('change', () => handleHeroFiles(heroInput.files));
    }

    function initQuill() {
      const editorEl = document.getElementById('editor');
      if (!editorEl) return;
      quill = new Quill(editorEl, {
        theme: 'snow',
        modules: {
          toolbar: [
            ['bold', 'italic', 'underline', 'strike'],
            [{ header: [1, 2, 3, false] }],
            ['blockquote', 'code-block'],
            [{ list: 'ordered' }, { list: 'bullet' }],
            ['link', 'image'],
            ['clean']
          ]
        }
      });
      quill.on('text-change', function() {
        updatePreview();
        saveDraft();
      });
    }

    function toggleEditor() {
      const format = document.getElementById('bodyFormat').value;
      const editor = document.getElementById('editor');
      const textarea = document.getElementById('body');
      if (format === 'html') {
        if (editor) editor.hidden = false;
        if (textarea) textarea.hidden = true;
      } else {
        if (editor) editor.hidden = true;
        if (textarea) textarea.hidden = false;
      }
    }
  </script>
</body>

[build]
  publish   = "public"
  functions = "netlify/functions"

# Deployment trigger Thu Sep 19 17:37:32 UTC 2025 - Universal media player deployment

[build.environment]
  NODE_VERSION = "18"

# Frontend calls like /api/blog-posts-list → serverless functions
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200
  force  = true

# CSP so TinyMCE loads
[[headers]]
  for = "/*"
  [headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.quilljs.com https://cdn.tiny.cloud; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.quilljs.com https://fonts.googleapis.com https://cdn.tiny.cloud; img-src 'self' data: blob: https://res.cloudinary.com https://sp.tinymce.com https://cdn.tiny.cloud; media-src 'self' https://res.cloudinary.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://app.streamofdan.com https://*.netlify.app https://*.netlify/functions https://cdn.tiny.cloud https://api.webflow.com https://api.cloudinary.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"

[build]
  publish = "."
  functions = "netlify/functions"

# Global functions config
[functions]
  node_bundler = "esbuild"

  # existing overrides you had
  [functions.cloudinary-metadata]
    timeout = 300
    memory  = 1024
    runtime = "nodejs18.x"

  [functions.file-manager-upload]
    timeout = 300
    memory  = 1024
    runtime = "nodejs18.x"

  # --- BLOG MEDIA (add these three) ---
  [functions.blog-media-list]
    timeout = 60
    memory  = 512
    runtime = "nodejs18.x"

  [functions.blog-media-upload]
    timeout = 300
    memory  = 1024
    runtime = "nodejs18.x"

  [functions.blog-media-delete]
    timeout = 60
    memory  = 512
    runtime = "nodejs18.x"

  # --- OPTIONAL: blog posts mgmt (archive/delete/list) ---
  [functions.blog-posts-list]
    timeout = 30
    memory  = 256
    runtime = "nodejs18.x"

  [functions.blog-posts-archive]
    timeout = 30
    memory  = 256
    runtime = "nodejs18.x"

  [functions.blog-posts-delete]
    timeout = 30
    memory  = 256
    runtime = "nodejs18.x"

# CORS for /api/* (kept from your file)
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"

# CORS for direct function calls (/.netlify/functions/*)
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, DELETE, OPTIONS"

# Security headers + CSP (kept, unchanged except formatting)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://widget.cloudinary.com https://upload-widget.cloudinary.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https://api.cloudinary.com https://res.cloudinary.com https://upload-widget.cloudinary.com https://xgm6-u3bi-jbxy.n7c.xano.io https://xajo-bs7d-cagt.n7e.xano.io; frame-src 'self' https://widget.cloudinary.com https://upload-widget.cloudinary.com; frame-ancestors 'self' https://history-of-idaho-broadcasting--717ee2.webflow.io https://www.streamofdan.com https://*.webflow.io; media-src 'self' https: blob:;"

# Redirects you already had
[[redirects]]
  from = "/api/upload"
  to   = "/.netlify/functions/uploader"
  status = 200

[[redirects]]
  from = "/voxpro-manager"
  to   = "/.netlify/functions/voxpro-manager"
  status = 200

[[redirects]]
  from = "/file-manager"
  to   = "/.netlify/functions/file-manager-page"
  status = 200

# Friendly aliases for the new blog media functions (optional)
[[redirects]]
  from = "/api/blog-media-list"
  to   = "/.netlify/functions/blog-media-list"
  status = 200

[[redirects]]
  from = "/api/blog-media-upload"
  to   = "/.netlify/functions/blog-media-upload"
  status = 200

[[redirects]]
  from = "/api/blog-media-delete"
  to   = "/.netlify/functions/blog-media-delete"
  status = 200

# Optional aliases for blog posts mgmt (if/when you add them)
[[redirects]]
  from = "/api/blog-posts-list"
  to   = "/.netlify/functions/blog-posts-list"
  status = 200

[[redirects]]
  from = "/api/blog-posts-archive"
  to   = "/.netlify/functions/blog-posts-archive"
  status = 200

[[redirects]]
  from = "/api/blog-posts-delete"
  to   = "/.netlify/functions/blog-posts-delete"
  status = 200

# Plugin (kept)
[[plugins]]
  package = "@netlify/plugin-functions-install-core"

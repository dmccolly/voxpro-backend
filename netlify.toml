[build]
  publish = "."

# Function-specific configuration
[functions]
  node_bundler = "esbuild"
  
  [functions.cloudinary-metadata]
    timeout = 300
    memory = 1024
    runtime = "nodejs18.x"
    
  [functions.file-manager-upload]
    timeout = 300
    memory = 1024

# Headers for CORS support
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"

# Security headers with updated CSP for Cloudinary, Xano, and Webflow embedding
[[headers]]
  for = "/*"
  [headers.values]
    # Allow embedding from your Webflow and site domains
    X-Frame-Options = "ALLOWALL"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; \
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://widget.cloudinary.com https://upload-widget.cloudinary.com; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data: https: blob:; \
      connect-src 'self' https://api.cloudinary.com https://res.cloudinary.com https://upload-widget.cloudinary.com \
        https://xgm6-u3bi-jbxy.n7c.xano.io https://xajo-bs7d-cagt.n7e.xano.io; \
      frame-src 'self' https://widget.cloudinary.com https://upload-widget.cloudinary.com; \
      frame-ancestors 'self' https://history-of-idaho-broadcasting--717ee2.webflow.io https://www.streamofdan.com https://*.webflow.io; \
      media-src 'self' https: blob:;"

# Redirects for API endpoints
[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/uploader"
  status = 200

[[redirects]]
  from = "/voxpro-manager"
  to = "/.netlify/functions/voxpro-manager"
  status = 200

[[redirects]]
  from = "/file-manager"
  to = "/.netlify/functions/file-manager-page"
  status = 200

# Build plugins
[[plugins]]
  package = "@netlify/plugin-functions-install-core"
